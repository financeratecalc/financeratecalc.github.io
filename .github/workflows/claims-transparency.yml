name: Claim transparency (Sigstore signature of the receipts snapshot)
# Every time a claim's value or hash changes, the receipts snapshot is regenerated from the data
# files and signed keylessly with Sigstore: the signing identity is this workflow in this repository,
# the signature and a timestamp go to the public, append-only Rekor log. Anyone can then verify a
# claim receipt against the signed snapshot without asking the publisher, and a correction becomes
# a dated log entry the publisher cannot remove. No keys, no cost.
on:
  workflow_dispatch:
  push:
    paths:
      - "api/index.json"
      - "api/lender/**"
      - "api/state/**"
      - "api/small-loan-penalty.json"
      - "api/denial-reasons-top100.json"
      - "data/door-effect-2025.json"
      - "claims/metro-gap-*.json"
      - "claims/national-fha-denial-rate-2025.json"
      - "scripts/build_receipts_snapshot.py"
      - ".github/workflows/claims-transparency.yml"
      - "data/application-outcomes-2025.json"
      - "data/programs/**"
      - "data/official/**"
      - "eval/runs/**"
      - "eval/runs/**"
permissions:
  contents: write
  id-token: write
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: sigstore/cosign-installer@v3
      - name: Regenerate the snapshot from the data files
        id: snap
        run: |
          python scripts/build_receipts_snapshot.py | tee /tmp/snap.json
          pip install -q "verifiers>=0.3.1" && pip install -q -e rl-env && python scripts/build_epoch_snapshot.py
          echo "sha256=$(sha256sum rl-env/frc_citation/receipts-snapshot.json | cut -c1-64)" >> $GITHUB_OUTPUT
      - name: Manifest of evaluation runs (so results are tamper-evident too)
        run: |
          python - <<'PY'
          import glob, hashlib, json, datetime, os
          rows = {os.path.basename(f): hashlib.sha256(open(f, "rb").read()).hexdigest() for f in sorted(glob.glob("eval/runs/*.json"))}
          json.dump({"generated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "count": len(rows),
                     "note": "SHA-256 of every saved automated run file; signed alongside the receipts snapshot so published results cannot be altered or pruned silently", "runs": rows},
                    open("transparency/eval-runs-manifest.json", "w"), indent=1)
          print(len(rows), "run files")
          PY
      - name: Sign keylessly (Sigstore / Rekor)
        run: |
          cosign sign-blob --yes transparency/eval-runs-manifest.json --bundle transparency/eval-runs-manifest.sigstore.json
          cosign sign-blob --yes rl-env/frc_citation/fixtures/epoch-snapshot.json --bundle transparency/epoch-snapshot.sigstore.json
          cosign sign-blob --yes rl-env/frc_citation/receipts-snapshot.json \
            --bundle transparency/receipts-snapshot.sigstore.json
          cosign verify-blob rl-env/frc_citation/receipts-snapshot.json \
            --bundle transparency/receipts-snapshot.sigstore.json \
            --certificate-identity-regexp "^https://github.com/financeratecalc/financeratecalc.github.io/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          python - <<'PY'
          import json, datetime, os, hashlib
          b = json.load(open("transparency/receipts-snapshot.sigstore.json"))
          # cosign sign-blob --bundle writes the legacy bundle: {base64Signature, cert, rekorBundle:{SignedEntryTimestamp, Payload:{body, integratedTime, logIndex, logID}}}
          pl = (b.get("rekorBundle") or {}).get("Payload") or {}
          entries = (b.get("verificationMaterial") or {}).get("tlogEntries") or []
          idx = pl.get("logIndex") or (entries[0].get("logIndex") if entries else None)
          ts = pl.get("integratedTime") or (entries[0].get("integratedTime") if entries else None)
          if ts: ts = datetime.datetime.utcfromtimestamp(int(ts)).strftime("%Y-%m-%dT%H:%M:%SZ")
          rb = json.load(open("transparency/eval-runs-manifest.sigstore.json")); rp = (rb.get("rekorBundle") or {}).get("Payload") or {}
          log = {"generated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "eval_runs_manifest_rekor_log_index": rp.get("logIndex"), "eval_runs_manifest_sha256": hashlib.sha256(open("transparency/eval-runs-manifest.json","rb").read()).hexdigest(),
                 "snapshot_sha256": "${{ steps.snap.outputs.sha256 }}", "rekor_log_index": idx,
                 "integrated_time": ts, "commit": os.environ.get("GITHUB_SHA"),
                 "identity": "https://github.com/financeratecalc/financeratecalc.github.io/.github/workflows/claims-transparency.yml@" + os.environ.get("GITHUB_REF", ""),
                 "verify_command": "cosign verify-blob receipts-snapshot.json --bundle receipts-snapshot.sigstore.json --certificate-identity-regexp '^https://github.com/financeratecalc/financeratecalc.github.io/' --certificate-oidc-issuer https://token.actions.githubusercontent.com"}
          hist = "transparency/log.json"
          H = json.load(open(hist)) if os.path.exists(hist) else {"entries": []}
          H["entries"] = [e for e in H["entries"] if e.get("rekor_log_index")] + [log]; H["latest"] = log
          log["rekor_url"] = f"https://search.sigstore.dev/?logIndex={idx}" if idx else None
          json.dump(H, open(hist, "w"), indent=1)
          print(json.dumps(log, indent=1))
          PY
      - name: Publish snapshot, bundle and log via the GitHub API
        run: |
          # GITHUB_TOKEN + git instead of a personal access token: the PAT expired on 2026-11-01 and the signed
          # snapshot stopped being published for ten days without anyone noticing. No personal token, nothing to expire.
          cp rl-env/frc_citation/receipts-snapshot.json rl-env/community/frc_citation/receipts-snapshot.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in rl-env/frc_citation/receipts-snapshot.json rl-env/community/frc_citation/receipts-snapshot.json transparency/receipts-snapshot.sigstore.json transparency/log.json transparency/eval-runs-manifest.json transparency/eval-runs-manifest.sigstore.json rl-env/frc_citation/fixtures/epoch-snapshot.json transparency/epoch-snapshot.sigstore.json; do [ -f "$p" ] && git add "$p"; done
          git diff --cached --quiet || git commit -m "claim transparency: signed receipts snapshot [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
