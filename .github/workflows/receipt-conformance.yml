name: Receipt 1.0 conformance (this publisher, against its own manifest)
on:
  workflow_run:
    workflows: ["Deploy MCP Worker"]
    types: [completed]
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Run the publisher-independent suite against the live manifest
        run: node spec/receipt-conformance.mjs https://financeratecalc.com/.well-known/receipt.json eval/receipt-conformance.json
      - name: Commit the report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/receipt-conformance.json
          git diff --cached --quiet || git commit -m "receipt 1.0 conformance report [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
