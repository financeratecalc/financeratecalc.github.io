name: Train contract-drift classifier (manual; CPU; eval committed; HF publish opt-in)
on:
  workflow_dispatch:
    inputs:
      base:
        description: base encoder
        default: distilroberta-base
      epochs:
        description: epochs
        default: "3"
      ood_only:
        description: "yes = do not train: load the published model and test it on hand-written sentences outside the generator's templates (eval/drift-ood-set.jsonl); a few minutes, no cost"
        default: "no"
      push:
        description: publish the model to Hugging Face (FinanceRateCalc/frc-contract-drift) — type yes to publish
        default: "no"
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q "transformers>=4.44" "accelerate>=0.30" numpy huggingface_hub
      - run: python scripts/build_drift_training_set.py | tail -3
        if: inputs.ood_only != 'yes'
      - name: Train and evaluate on held-out claim ids
        if: inputs.ood_only != 'yes'
        run: python scripts/train_drift_classifier.py --base "${{ inputs.base }}" --epochs "${{ inputs.epochs }}" --out models/frc-contract-drift
      - name: Keep the trained model as a run artifact (so a publish failure does not cost the training)
        if: always() && inputs.ood_only != 'yes'
        continue-on-error: true  # an artifact-service outage must not discard the evaluation or the publish
        uses: actions/upload-artifact@v4
        with:
          name: frc-contract-drift
          path: |
            models/frc-contract-drift
            !models/frc-contract-drift/_trainer
          retention-days: 14
      - name: Publish the evaluation and the data set summary
        if: inputs.ood_only != 'yes'
        run: |
          cp models/frc-contract-drift/eval.json eval/drift-model-eval.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/drift-model-eval.json eval/drift-training-set.json eval/drift-training-set.jsonl
          git diff --cached --quiet || git commit -m "drift classifier: eval + data set [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
      - name: Publish the model to Hugging Face (only when push=yes)
        if: inputs.push == 'yes' && inputs.ood_only != 'yes'
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          tok = os.environ.get("HF_TOKEN")
          if not tok: raise SystemExit("HF_TOKEN secret is empty")
          api = HfApi(token=tok)
          who = api.whoami(); print("token belongs to:", who.get("name"), "| orgs:", [o.get("name") for o in who.get("orgs", [])])
          try:
              api.create_repo("FinanceRateCalc/frc-contract-drift", repo_type="model", exist_ok=True)
          except Exception as e:
              print("create_repo failed (create the empty model repo FinanceRateCalc/frc-contract-drift in the HF UI once, then re-run):", type(e).__name__, str(e)[:300])
          api.upload_folder(folder_path="models/frc-contract-drift", repo_id="FinanceRateCalc/frc-contract-drift", repo_type="model",
                            ignore_patterns=["_trainer/*"], commit_message="train from rule-generated set")
          print("pushed FinanceRateCalc/frc-contract-drift")
          PY
      - name: Out-of-template test of the published model (hand-written sentences)
        if: inputs.ood_only == 'yes' || inputs.push == 'yes'
        run: |
          python scripts/eval_drift_ood.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/drift-model-ood.json
          git diff --cached --quiet || git commit -m "drift classifier: out-of-template test [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
