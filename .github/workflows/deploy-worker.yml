name: Deploy MCP Worker

# Deploys worker/index.js to the frc-mcp Cloudflare Worker.
# Runs on GitHub's infrastructure, which can reach api.cloudflare.com.
# Manual trigger, or automatically when the worker source changes on main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/index.js', 'wrangler.toml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check before touching production
        run: node --check worker/index.js

      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest deploy worker/index.js \
            --name frc-mcp \
            --compatibility-date 2026-01-01 \
            --kv-namespace CREDITS=4f804c8639104c2cab42433d2ae061db

      - name: Verify the deployed server answers
        run: |
          sleep 5
          echo "tools/list:"
          curl -s -X POST https://frc-mcp.ziyetis.workers.dev \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | grep -o '"name":"[a-z_]*"' | sort
