name: Pre-registered re-scan, 2 January 2027 (2026 limits as the stale set)
# Pre-registered 2026-10-18 (rules/rule-calendar.json, sha256 of the prediction text). Runs once, publishes unedited.
on:
  schedule:
    - cron: "0 9 2 1 *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_SET: "2026"
          SCAN_OUT: eval/stale-constants-scan-2027-01-02
        run: node scripts/stale_constant_scan.mjs
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/stale-constants-scan-2027-01-02.json eval/stale-constants-scan-2027-01-02.md
          git commit -m "pre-registered re-scan 2027-01-02: 2026 limits as the stale set [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
