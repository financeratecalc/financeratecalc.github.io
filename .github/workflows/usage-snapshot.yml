name: Usage snapshot (who is calling the tools)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch /usage and /misquotes, summarise
        run: |
          python - <<'PY'
          import json, urllib.request, datetime, re, collections
          u = json.load(urllib.request.urlopen(urllib.request.Request("https://frc-mcp.ziyetis.workers.dev/usage", headers={"User-Agent": "frc-usage-snapshot"}), timeout=30))
          rows = u.get("days") or {}
          selftest = re.compile(r"frc-selftest|curl|node|python|postman|insomnia", re.I)
          by_day = {}; by_client = collections.Counter(); by_tool = collections.Counter(); verify = collections.Counter()
          for day, clients in sorted(rows.items()):
              tot = ext = 0
              for client, events in clients.items():
                  for ev, n in events.items():
                      n = int(n)
                      if client == "verify":
                          verify[ev] += n; continue
                      tot += n
                      if not selftest.search(client):
                          ext += n; by_client[client] += n; by_tool[ev] += n
              by_day[day] = {"all_calls": tot, "external_calls": ext}
          out = {"generated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "days": by_day, "external_calls_total": sum(d["external_calls"] for d in by_day.values()),
                 "external_clients": by_client.most_common(30), "external_tools": by_tool.most_common(30),
                 "verify_by_channel_status": dict(verify), "raw_note": u.get("note")}
          # Exact per-request verify log (worker 1.33+): who is checking receipts, excluding our own suites.
          vl = u.get("verify_log") or {}
          ext = collections.Counter(); ours = 0; ext_by_day = {}
          for day, groups in sorted(vl.items()):
              for g, n in groups.items():
                  ch, st, cls, via, cc = (g.split("|") + ["?"] * 5)[:5]
                  if cls == "ours":
                      ours += n; continue
                  ext[f"{ch[:1]}|{st}|{cls}|{via}|{cc}"] += n
                  ext_by_day[day] = ext_by_day.get(day, 0) + n
          out["verify_log_external"] = {"since": min(vl) if vl else None, "total": sum(ext.values()), "ours_excluded": ours,
                                        "by_day": ext_by_day, "groups": ext.most_common(40),
                                        "key": "channel letter|status|requester class|via|country; class 'script' can still be us (manual curl) and 'browser' can be Ziya"}
          # Bundle fetches (worker 1.38+): who pulls the one-file claim bundle through the counted mirror.
          bf = u.get("bundle_fetches") or {}
          out["bundle_fetches"] = {"by_day": {d: sum(g.values()) for d, g in sorted(bf.items())},
                                   "groups": collections.Counter({g: n for d in bf for g, n in bf[d].items()}).most_common(30) if bf else [],
                                   "key": "requester class|via|country; mirror https://frc-mcp.ziyetis.workers.dev/llms-full.txt; Pages itself keeps no log"}
          json.dump(out, open("eval/usage-snapshot.json", "w"), indent=1)
          # Reverse receipts: per-claim crawler verifications (bots only; bot name, day, count, status). transparency/crawl-ledger.json
          cl = u.get("crawl_ledger") or {}
          ledger = {"generated": out["generated"], "since": "2026-10-22", "rule": "Bots only, identified by User-Agent. Per claim id: crawler, first and last day it verified the receipt, number of checks, status counts. No IP, no time of day, no receipt text. A verification is a check of a figure's receipt, not a citation of it.",
                    "claims": cl, "claims_with_crawler_verification": len(cl), "checks": sum(b["n"] for e in cl.values() for b in e.values()),
                    "by_crawler": {}}
          for e in cl.values():
              for bot, b in e.items():
                  d = ledger["by_crawler"].setdefault(bot, {"claims": 0, "checks": 0, "last": b["last"]}); d["claims"] += 1; d["checks"] += b["n"]; d["last"] = max(d["last"], b["last"])
          json.dump(ledger, open("transparency/crawl-ledger.json", "w"), indent=1)
          print(json.dumps(out, indent=1)[:4000])
          PY
      - name: Rebuild the claim bundle with the new ledger (reverse-receipt lines)
        run: python3 scripts/build_llms_full.py
      - name: Rebuild index pages (new pages get an incoming link)
        run: python3 scripts/build_site_index.py
      - name: Commit snapshot and crawl ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/usage-snapshot.json transparency/crawl-ledger.json llms-full.txt metro/index.html stat/index.html city/index.html site-index.html
          git diff --cached --quiet || git commit -m "usage snapshot [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
