name: Build provenance (recompute from the CFPB file, attest)
# Downloads the public CFPB HMDA 2025 FHA extract, runs the published reference implementation
# at this commit, compares the result with the published data files, and attests the report
# with SLSA build provenance (GitHub OIDC identity -> Sigstore/Rekor). The chain is then:
# receipt hash -> signed snapshot -> this attestation -> SHA-256 of the CFPB input file.
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "CFPB file URL (FHA extract)"
        default: "https://ffiec.cfpb.gov/v2/data-browser-api/view/nationwide/csv?years=2025&loan_types=2"
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download the CFPB file
        run: |
          curl -L --compressed --retry 3 --max-time 3600 -o /tmp/hmda_2025_fha.csv -w "http %{http_code} type %{content_type} bytes %{size_download}\n" "${{ github.event.inputs.source_url }}" 2>&1 | tee -a /tmp/run.log
          ls -la /tmp/hmda_2025_fha.csv | tee -a /tmp/run.log; head -c 800 /tmp/hmda_2025_fha.csv | tee -a /tmp/run.log; echo; wc -l /tmp/hmda_2025_fha.csv | tee -a /tmp/run.log
          echo "INPUT_SHA=$(sha256sum /tmp/hmda_2025_fha.csv | cut -c1-64)" >> $GITHUB_ENV
          echo "INPUT_BYTES=$(stat -c%s /tmp/hmda_2025_fha.csv)" >> $GITHUB_ENV
      - name: Run the reference implementation
        run: |
          set -o pipefail
          python scripts/reference_implementation.py /tmp/hmda_2025_fha.csv 2>&1 | tee -a /tmp/run.log | tail -25
          ls -la /tmp/frc_rebuild.json | tee -a /tmp/run.log
      - name: Compare with the published data files
        run: |
          python scripts/compare_rebuild.py /tmp/frc_rebuild.json "$INPUT_SHA" 2>&1 | tee -a /tmp/run.log
          python - <<'PY'
          import json, os
          r = json.load(open("provenance/rebuild-report.json"))
          r["input"] = {"url": "${{ github.event.inputs.source_url }}", "sha256": os.environ["INPUT_SHA"], "bytes": int(os.environ["INPUT_BYTES"])}
          r["code"] = {"repository": "financeratecalc/financeratecalc.github.io", "commit": os.environ["GITHUB_SHA"], "script": "scripts/reference_implementation.py"}
          r["workflow"] = "${{ github.workflow }} / run ${{ github.run_id }}"
          json.dump(r, open("provenance/rebuild-report.json", "w"), indent=1)
          PY
      - name: Attest build provenance of the report (SLSA, Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: provenance/rebuild-report.json
      - name: Publish the report via the GitHub API
        if: always()
        env:
          GH_PAT: ${{ secrets.EVAL_PAT }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request, datetime
          tok = os.environ["GH_PAT"]; repo = "financeratecalc/financeratecalc.github.io"
          stamp = datetime.datetime.utcnow().strftime("%Y%m%dT%H%M")
          for path, dest in [("provenance/rebuild-report.json", "provenance/rebuild-report.json"), ("provenance/rebuild-report.json", f"provenance/history/rebuild-{stamp}.json"), ("/tmp/run.log", "provenance/last-run.log")]:
              if not os.path.exists(path): continue
              url = f"https://api.github.com/repos/{repo}/contents/{dest}"
              sha = None
              try: sha = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": f"token {tok}"}))).get("sha")
              except Exception: pass
              data = {"message": f"build provenance: rebuild report {stamp}", "content": base64.b64encode(open(path, "rb").read()).decode(), "branch": "main"}
              if sha: data["sha"] = sha
              req = urllib.request.Request(url, method="PUT", data=json.dumps(data).encode(), headers={"Authorization": f"token {tok}", "Content-Type": "application/json"})
              print(dest, urllib.request.urlopen(req).status)
          PY
