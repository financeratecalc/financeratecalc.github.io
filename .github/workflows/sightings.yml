name: Receipt sightings (weekly count outside this site)
# The one measurement that decides whether the receipt layer is used or a museum piece.
# Sources searched: GitHub code search, Hugging Face (models/datasets/spaces), the misquote
# ledger (entries carrying a receipt), and /verify's per-channel tallies. Counts only; no people.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, datetime
          today = datetime.date.today().isoformat()
          out = {"date": today, "method": "counts of unambiguous markers (our receipt token, the spec filename, our name on Hugging Face, receipts in the misquote ledger) outside financeratecalc.github.io where a claim receipt or claims.json contract appears; GitHub code search, Hugging Face search, the misquote ledger, /verify channel tallies", "sources": {}}
          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {"User-Agent": "frc-sightings"})
              with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)
          # GitHub code search (excluding our own repos)
          gh = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "User-Agent": "frc-sightings"}
          import time
          for name, q in [("github_frc_spec_link", 'claim-contract-1.0-draft -repo:'),
                          ("github_receipt_token", '"FRC:national-fha-denial-rate-2025" -repo:financeratecalc/financeratecalc.github.io -repo:financeratecalc/community-environments -repo:financeratecalc/frc-mcp'),
                          ("github_receipt_any", '"⟦FRC:" -repo:financeratecalc/financeratecalc.github.io -repo:financeratecalc/community-environments -repo:financeratecalc/frc-mcp'),
                          ]:
              try:
                  time.sleep(8)  # code search allows ~10 requests/minute
                  d = get("https://api.github.com/search/code?q=" + urllib.parse.quote(q), gh)
                  out["sources"][name] = {"count": d.get("total_count", 0), "repos": sorted({i["repository"]["full_name"] for i in d.get("items", [])})[:20]}
              except Exception as e:
                  out["sources"][name] = {"error": str(e)[:120]}
          # Hugging Face: models/datasets/spaces mentioning the publisher or the receipt
          for kind in ("models", "datasets", "spaces"):
              try:
                  d = get(f"https://huggingface.co/api/{kind}?search=financeratecalc&limit=50")
                  ids = [x.get("id") or x.get("modelId") for x in d]
                  out["sources"]["hf_" + kind] = {"count": len([i for i in ids if i and not i.lower().startswith("financeratecalc/")]), "ids": [i for i in ids if i and not i.lower().startswith("financeratecalc/")][:20]}
              except Exception as e:
                  out["sources"]["hf_" + kind] = {"error": str(e)[:120]}
          # Misquote ledger: entries carrying a receipt
          try:
              d = get("https://frc-mcp.ziyetis.workers.dev/misquotes")
              ents = d.get("entries", [])
              out["sources"]["misquote_ledger_with_receipt"] = {"count": sum(1 for e in ents if e.get("receipt")), "total_entries": len(ents)}
          except Exception as e:
              out["sources"]["misquote_ledger_with_receipt"] = {"error": str(e)[:120]}
          # /verify channel tallies (from /usage: client 'verify', event '<channel>:<status>')
          try:
              d = get("https://frc-mcp.ziyetis.workers.dev/usage")
              agg = {}
              for day, clients in d.get("days", {}).items():
                  for ev, n in (clients.get("verify") or {}).items():
                      agg[ev] = agg.get(ev, 0) + n
              out["sources"]["verify_calls_by_channel_status"] = agg
          except Exception as e:
              out["sources"]["verify_calls_by_channel_status"] = {"error": str(e)[:120]}
          ext = 0
          for k in ("github_frc_spec_link", "github_receipt_token", "github_receipt_any", "hf_models", "hf_datasets", "hf_spaces", "misquote_ledger_with_receipt"):
              v = out["sources"].get(k, {}); ext += int(v.get("count", 0)) if isinstance(v, dict) else 0
          out["external_sightings_total"] = ext
          p = "eval/sightings.json"
          H = json.load(open(p)) if os.path.exists(p) else {"purpose": "weekly count of our claim receipts / contracts seen outside this site; the adoption measurement", "history": []}
          H["history"] = [h for h in H["history"] if h.get("date") != today] + [out]; H["latest"] = out
          json.dump(H, open(p, "w"), indent=1, ensure_ascii=False)
          print(json.dumps(out, indent=1))
          PY
      - name: Commit weekly count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/sightings.json
          git diff --cached --quiet || git commit -m "sightings: weekly count [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
