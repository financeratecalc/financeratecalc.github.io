name: Door Report product rules (no ranking, same caveat)
on:
  push:
    paths: ['door-report.html', 'data/door-report-cells-2025.json', 'scripts/door_report_rules_test.py']
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/door_report_rules_test.py
