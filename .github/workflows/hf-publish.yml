name: Publish benchmark to Hugging Face
on:
  workflow_dispatch:
    inputs:
      mirror:
        description: "Optional: a folder name under data/hf-mirrors/ to upload to the dataset FinanceRateCalc/<name> instead of the benchmark (e.g. fha-denial-reason-fingerprints)"
        default: ""
  push:
    paths: [benchmark.json, benchmark-2026-09.json, scripts/build_hf_benchmark.py]
permissions:
  contents: write
  issues: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q huggingface_hub
      - name: Mirror upload (only when the mirror input is set; replaces the files of that dataset)
        if: github.event.inputs.mirror != ''
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", MIRROR: "${{ github.event.inputs.mirror }}" }
        run: |
          python - <<'PY'
          import os, sys, traceback
          try:
            from huggingface_hub import HfApi
            m = os.environ["MIRROR"]; folder = os.path.join("data", "hf-mirrors", m)
            if not os.path.isdir(folder): raise SystemExit(f"no folder {folder}")
            tok = os.environ.get("HF_TOKEN") or ""
            api = HfApi(token=tok); who = api.whoami()
            info = "whoami: %s | token role: %s | fine-grained: %s | files: %s" % (who.get("name"), (who.get("auth") or {}).get("accessToken", {}).get("role"), (who.get("auth") or {}).get("accessToken", {}).get("fineGrained", {}).get("scoped") is not None, sorted(os.listdir(folder)))
            print(info); repo = f"FinanceRateCalc/{m}"
            api.upload_folder(folder_path=folder, repo_id=repo, repo_type="dataset",
                              commit_message=f"mirror refresh from data/hf-mirrors/{m} at {os.environ.get('GITHUB_SHA','')[:10]}")
            open("hf-publish-result.txt", "w").write("OK mirror uploaded to %s\n%s\n" % (repo, info))
          except BaseException:
            open("hf-publish-result.txt", "w").write(traceback.format_exc()[-3000:]); sys.exit(1)
          PY
      - name: Key must pass its own check before anything is published
        if: github.event.inputs.mirror == ''
        run: python scripts/check_benchmark_key.py
      - name: Build package from the site's JSON
        if: github.event.inputs.mirror == ''
        run: python scripts/build_hf_benchmark.py --out hf-pkg && ls hf-pkg
      - name: Upload (replaces older instrument CSVs)
        if: github.event.inputs.mirror == ''
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: |
          python - <<'PY'
          import os, glob
          from huggingface_hub import HfApi
          import traceback, sys
          try:
            api = HfApi(token=os.environ["HF_TOKEN"]); repo = "FinanceRateCalc/denial-ai-benchmark"
            print("whoami:", api.whoami().get("name"))
            existing = api.list_repo_files(repo, repo_type="dataset")
            stale = [f for f in existing if f.startswith("denial_ai_benchmark_v1") and f not in [os.path.basename(p) for p in glob.glob("hf-pkg/*.csv")]]
            ops = [ {"path_in_repo": os.path.basename(p), "path_or_fileobj": p} for p in glob.glob("hf-pkg/*") if not p.endswith("UPLOAD.md") ]
            from huggingface_hub import CommitOperationAdd, CommitOperationDelete
            operations = [CommitOperationAdd(**o) for o in ops] + [CommitOperationDelete(path_in_repo=f) for f in stale]
            api.create_commit(repo_id=repo, repo_type="dataset", operations=operations,
                              commit_message="v1.3: ground truths regenerated from data under named universes (universes.json); key self-check 12/12; July + Sept 15 results")
            open("hf-publish-result.txt", "w").write("OK uploaded %s deleted %s\n" % ([o["path_in_repo"] for o in ops], stale))
          except Exception:
            open("hf-publish-result.txt", "w").write(traceback.format_exc()[-3000:]); sys.exit(1)
          PY
      - name: Report result as an issue (readable from the API even when logs are not)
        if: always()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          body=$(cat hf-publish-result.txt 2>/dev/null || echo "no result file written; the upload step failed before the try block (import or syntax error)")
          gh issue create --title "hf-publish run $(date -u +%Y-%m-%dT%H:%MZ): ${{ job.status }}" --body "$body" || true
