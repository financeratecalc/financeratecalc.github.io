name: Release-day machine (CFPB file to every figure, receipt and page; dry run by default; also rebuilds application outcomes)
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "CFPB file URL (FHA extract for the year)"
        default: "https://ffiec.cfpb.gov/v2/data-browser-api/view/nationwide/csv?years=2025&loan_types=2"
      year:
        description: "HMDA activity year in the file"
        default: "2025"
      apply:
        description: "Type APPLY to write the rebuilt data into the site and rebuild claims, contracts, bundle and pages. Anything else = dry run (compare only)."
        default: "dry-run"
      loan_type:
        description: "HMDA loan_type: 2 = FHA (the published pipeline; default). 3 = VA, 4 = USDA, 1 = conventional (closed-end): first-release run per provenance/universe-expansion-2025.md — writes data/programs/<program>-2025.json and the universe count only; never touches the FHA files. source_url is derived from this when it is not 2."
        default: "2"
      official:
        description: "Level-2 restatement run instead of the HMDA pipeline: <source>:<yyyy-mm>, e.g. hud-fhaprod:2026-08. Downloads the official document, hashes it, copies the labelled cells, builds claim documents, contracts, hash history and snapshot, commits. Leave empty for HMDA runs."
        default: ""
      independent:
        description: "yes = also recompute national/state/lender figures with hmda-analyzer (third-party code) and write provenance/independent-reproduction.json"
        default: "no"
permissions:
  contents: write
  issues: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 0. Official-publication restatement (Level 2) - when the official input is set, this is the whole run
        if: github.event.inputs.official != ''
        run: |
          set -eo pipefail
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          pip install -q pypdf
          SRC="${{ github.event.inputs.official }}"; S="${SRC%%:*}"; P="${SRC##*:}"
          python3 scripts/official_restate.py "$S" "$P" 2>&1 | tee /tmp/official.log
          test -f "data/official/$S-$P.json" || { echo "no data file written" | tee -a /tmp/official.log; exit 1; }
          python3 scripts/build_claim_documents.py | tail -1
          python3 scripts/build_claim_contracts.py | tail -1
          python3 scripts/build_claims_index.py
          python3 scripts/build_receipt_hash_history.py | tail -1
          python3 scripts/build_receipts_snapshot.py | tail -1
          python3 scripts/build_official_page.py
          python3 scripts/build_revisions_feed.py
          python3 scripts/build_home.py && python3 scripts/build_claim_jsonld.py | tail -1
          python3 scripts/build_llms_full.py | tail -1
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/official data/revisions.json claims transparency llms-full.txt rl-env/frc_citation/receipts-snapshot.json official-figures.html index.html
          git reset -q data/official/cache 2>/dev/null || true
          git diff --cached --quiet || git commit -m "official restatement: $S $P [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
      - name: 0r. Report the official-restatement log as an issue when it fails (logs are not readable from the API)
        if: failure() && github.event.inputs.official != ''
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          body=$(tail -c 3000 /tmp/official.log 2>/dev/null || echo "no log written")
          gh issue create --title "official restatement ${{ github.event.inputs.official }} $(date -u +%Y-%m-%dT%H:%MZ): failure" --body "$body" || true
      - name: 1. Download the CFPB file and record its hash
        if: github.event.inputs.official == ''
        run: |
          URL="${{ github.event.inputs.source_url }}"
          if [ "${{ github.event.inputs.loan_type }}" != "2" ]; then URL="https://ffiec.cfpb.gov/v2/data-browser-api/view/nationwide/csv?years=${{ github.event.inputs.year }}&loan_types=${{ github.event.inputs.loan_type }}"; fi
          echo "$URL" > /tmp/input.url
          curl -L --compressed --retry 3 --max-time 3600 -o /tmp/hmda.csv -w "http %{http_code} bytes %{size_download}\n" "$URL"
          sha256sum /tmp/hmda.csv | cut -c1-64 | tee /tmp/input.sha256
      - name: 2. Reference implementation (one pass over the file)
        run: python3 scripts/reference_implementation.py /tmp/hmda.csv 2>&1 | tail -12
        if: github.event.inputs.loan_type == '2' && github.event.inputs.official == ''
      - name: 2p. Program first release (VA / USDA / conventional) - reference implementation, outcomes, summary; FHA files untouched
        if: github.event.inputs.loan_type != '2' && github.event.inputs.official == ''
        run: |
          set -e
          LT="${{ github.event.inputs.loan_type }}"; CE=""; if [ "$LT" = "1" ]; then CE="--closed-end"; fi
          python3 scripts/reference_implementation.py /tmp/hmda.csv --loan-type $LT $CE --out /tmp/frc_rebuild_program.json 2>&1 | tail -6
          python3 scripts/application_outcomes.py /tmp/hmda.csv /tmp/outcomes_program.json --loan-type $LT $CE | tail -1
          python3 scripts/program_summary.py /tmp/frc_rebuild_program.json /tmp/outcomes_program.json --sha256 "$(cat /tmp/input.sha256)" --url "$(cat /tmp/input.url)"
          PROG=$(python3 -c "print({'3':'va','4':'usda','1':'conv'}['$LT'])")
          python3 scripts/build_claim_documents.py | tail -1
          python3 scripts/build_claim_contracts.py | tail -1
          python3 scripts/build_claims_index.py
          python3 scripts/build_receipt_hash_history.py | tail -1
          python3 scripts/build_receipts_snapshot.py 2>/dev/null | tail -1 | cut -c1-120
          python3 scripts/build_program_page.py "$PROG"
          python3 scripts/build_llms_full.py | tail -1
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/programs universes.json claims transparency llms-full.txt rl-env/frc_citation/receipts-snapshot.json "$PROG"-loan-denial-rates-2025.html conventional-loan-denial-rates-2025.html 2>/dev/null || git add data/programs universes.json claims transparency llms-full.txt rl-env/frc_citation/receipts-snapshot.json
          git diff --cached --quiet || git commit -m "program first release: loan_type $LT, ${{ github.event.inputs.year }} file [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
          echo "PROGRAM_RUN=1" >> $GITHUB_ENV
      - name: 3. Materialize api/ files from the rebuild
        if: github.event.inputs.loan_type == '2' && github.event.inputs.official == ''
        run: |
          PANEL=fresh; if [ "${{ github.event.inputs.year }}" = "2025" ]; then PANEL=frozen; fi
          python3 scripts/materialize_rebuild.py /tmp/frc_rebuild.json --year "${{ github.event.inputs.year }}" --out /tmp/materialized --panel $PANEL
      - name: 4. Application outcomes and door-report cells from the same file
        if: github.event.inputs.loan_type == '2' && github.event.inputs.official == ''
        run: |
          python3 scripts/application_outcomes.py /tmp/hmda.csv /tmp/materialized/data/application-outcomes-${{ github.event.inputs.year }}.json | tail -1
          python3 scripts/door_report_cells.py /tmp/hmda.csv /tmp/materialized/data/door-report-cells-${{ github.event.inputs.year }}.json 2>&1 | tail -1
      - name: 5. Dry run - compare with the published files, number by number
        if: github.event.inputs.loan_type == '2' && github.event.inputs.official == ''
        run: |
          python3 scripts/compare_tree.py /tmp/materialized provenance/release-day-dryrun.json
          python3 - <<'PY'
          import json, os
          r = json.load(open("provenance/release-day-dryrun.json"))
          r["input"] = {"url": "${{ github.event.inputs.source_url }}", "sha256": open("/tmp/input.sha256").read().strip(), "year": "${{ github.event.inputs.year }}"}
          r["code_commit"] = os.environ["GITHUB_SHA"]; r["mode"] = "${{ github.event.inputs.apply }}"
          json.dump(r, open("provenance/release-day-dryrun.json", "w"), indent=1, ensure_ascii=False)
          print("verdict:", r["verdict"], "| numeric match", r["numeric_match_rate"])
          PY
      - name: 5b. Independent implementation - recompute national, state and lender figures with hmda-analyzer (third-party code) and compare
        if: github.event.inputs.independent == 'yes' && github.event.inputs.loan_type == '2' && github.event.inputs.official == ''
        run: |
          pip install -q "hmda-analyzer==0.6.1" "pandas>=2.2"
          python3 scripts/independent_reproduction.py /tmp/hmda.csv provenance/independent-reproduction.json 2>&1 | tail -3
          python3 - <<'PY'
          import json, os
          r = json.load(open("provenance/independent-reproduction.json"))
          r["input"]["url"] = "${{ github.event.inputs.source_url }}"; r["input"]["year"] = "${{ github.event.inputs.year }}"
          r["code_commit"] = os.environ["GITHUB_SHA"]; r["run_id"] = os.environ["GITHUB_RUN_ID"]
          json.dump(r, open("provenance/independent-reproduction.json", "w"), indent=1, ensure_ascii=False)
          PY
      - name: 6. APPLY - write the rebuilt data into the site and rebuild everything that derives from it
        if: github.event.inputs.apply == 'APPLY' && github.event.inputs.loan_type == '2' && github.event.inputs.official == ''
        run: |
          set -e
          cp -r /tmp/materialized/api/. api/
          cp /tmp/materialized/data/*.json data/
          python3 scripts/build_api_summaries.py
          python3 scripts/build_claim_documents.py
          python3 scripts/build_claim_contracts.py
          python3 scripts/build_receipt_hash_history.py
          python3 scripts/build_receipts_snapshot.py | tail -1
          python3 scripts/build_outcomes_page.py
          python3 scripts/build_outcomes_csv.py
          python3 scripts/build_reason_fingerprints_page.py
          python3 scripts/build_lender_reason_sections.py
          python3 scripts/build_claim_jsonld.py | tail -1
          python3 scripts/build_llms_full.py | tail -1
          python3 scripts/build_site_index.py | tail -1
          python3 scripts/check_page_values.py --fix | tail -1
          python3 scripts/check_page_phrasing.py | tail -1
      - name: 7. Commit (dry-run report always; the site only on APPLY)
        if: github.event.inputs.loan_type == '2' && github.event.inputs.official == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add provenance/release-day-dryrun.json
          [ -f provenance/independent-reproduction.json ] && git add provenance/independent-reproduction.json
          if [ "${{ github.event.inputs.apply }}" = "APPLY" ]; then git add -A api data claims transparency llms-full.txt where-fha-applications-end.html site-index.html metro stat city eval/page-value-fix-*.json rl-env/frc_citation/receipts-snapshot.json *.html; fi
          git diff --cached --quiet || git commit -m "release-day machine: ${{ github.event.inputs.apply }} on ${{ github.event.inputs.year }} file [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
