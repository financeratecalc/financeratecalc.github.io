name: Application outcomes (where FHA applications end, by lender, from the CFPB file)
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "CFPB file URL (FHA extract)"
        default: "https://ffiec.cfpb.gov/v2/data-browser-api/view/nationwide/csv?years=2025&loan_types=2"
permissions:
  contents: write
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download the CFPB file
        run: |
          curl -L --compressed --retry 3 --max-time 3600 -o /tmp/hmda_2025_fha.csv -w "http %{http_code} bytes %{size_download}\n" "${{ github.event.inputs.source_url }}"
          sha256sum /tmp/hmda_2025_fha.csv | cut -c1-64 | tee /tmp/input.sha256
      - name: Build outcomes (five ends per application; no ranking field)
        run: python scripts/application_outcomes.py /tmp/hmda_2025_fha.csv data/application-outcomes-2025.json 2>&1 | tail -3
      - name: Record input hash and code commit
        run: |
          python - <<'PY'
          import json, os
          p = "data/application-outcomes-2025.json"; d = json.load(open(p, encoding="utf-8"))
          d["input_sha256"] = open("/tmp/input.sha256").read().strip(); d["code_commit"] = os.environ["GITHUB_SHA"]
          d["source_url"] = "${{ github.event.inputs.source_url }}"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=1, ensure_ascii=False)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/application-outcomes-2025.json
          git diff --cached --quiet || git commit -m "application outcomes rebuilt from the CFPB file [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
