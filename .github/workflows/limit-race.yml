name: 2027 limit race (daily, Nov 10 - Feb 15; costs API credit when RACE_ENABLED=1)
# Asks each reachable engine three questions a day and grades them against the dated rule files.
# Spending is off until the repository variable RACE_ENABLED is set to 1 (Settings -> Variables).
on:
  schedule:
    - cron: "40 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          RACE_ENABLED: ${{ vars.RACE_ENABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/limit_race.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/race-2027 race-2027.html 2>/dev/null || true
          git commit -m "limit race $(date -u +%F) [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
