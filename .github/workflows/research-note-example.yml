name: research-note example (live)
# Runs examples/research-note against the live endpoint and commits the sample output, so the README's "what you get"
# is produced, not typed. Manual and weekly. No model, no cost beyond HTTP.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"
permissions:
  contents: write
jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node examples/research-note/make_note.mjs national-fha-denial-rate-2025 examples/research-note/sample-output
      - run: |
          git config user.name "frc-example" && git config user.email "press@financeratecalc.com"
          git add examples/research-note/sample-output
          git diff --cached --quiet || git commit -m "research-note example: sample output refreshed [skip ci]"
          git pull --rebase -q origin main && git push -q origin main
