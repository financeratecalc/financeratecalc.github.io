name: Publish frc-mcp to the official MCP Registry
# Publishes worker/server.json under the io.github.financeratecalc namespace using the
# repository's OIDC identity (no personal token). Re-run after bumping the version.
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/ && mcp-publisher --help | head -5
      - name: Validate and publish
        working-directory: worker
        run: |
          set -o pipefail
          ( cat server.json; mcp-publisher login github-oidc; mcp-publisher publish ) 2>&1 | tee /tmp/publish.log || echo "PUBLISH FAILED" >> /tmp/publish.log
      - name: Save the log in the repository (the editor cannot read Actions logs through the proxy)
        if: always()
        env:
          GH_PAT: ${{ secrets.EVAL_PAT }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          tok = os.environ["GH_PAT"]; repo = "financeratecalc/financeratecalc.github.io"; path = "worker/registry-publish.log"
          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          sha = None
          try: sha = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": f"token {tok}"}))).get("sha")
          except Exception: pass
          body = open("/tmp/publish.log", "rb").read() if os.path.exists("/tmp/publish.log") else b"no log"
          data = {"message": "mcp registry publish log [skip ci]", "content": base64.b64encode(body).decode(), "branch": "main"}
          if sha: data["sha"] = sha
          req = urllib.request.Request(url, method="PUT", data=json.dumps(data).encode(), headers={"Authorization": f"token {tok}", "Content-Type": "application/json"})
          print(urllib.request.urlopen(req).status)
          PY
          grep -q "PUBLISH FAILED" /tmp/publish.log && exit 1 || true
