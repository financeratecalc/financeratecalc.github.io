name: LettuceDetect probe (span-level grounding vs fidelity grades; manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q lettucedetect
      - run: python scripts/lettuce_probe.py eval/lettuce-probe-$(date -u +%F).json | tail -12
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/lettuce-probe-*.json
          git diff --cached --quiet || git commit -m "lettuce probe result [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
