name: Denial-AI fidelity eval (Inspect)
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Inspect model id"
        default: "anthropic/claude-sonnet-4-6"
      condition:
        description: "task: denial_ai_fidelity (no tools) or denial_ai_fidelity_with_source (MCP)"
        default: "denial_ai_fidelity_with_source"
      grader:
        description: "Grader model for the fidelity scorer"
        default: "anthropic/claude-sonnet-4-6"
permissions:
  contents: write
  issues: write
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q inspect_ai anthropic openai google-genai xai_sdk mcp
      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          INSPECT_EVAL_MODEL: ${{ github.event.inputs.model }}
          INSPECT_GRADER_MODEL: ${{ github.event.inputs.grader }}
          INSPECT_TASK: ${{ github.event.inputs.condition }}
        run: |
          mkdir -p eval/runs
          python - <<'PY'
          import os, json, urllib.request
          out = []
          def get(url, headers):
              req = urllib.request.Request(url, headers=headers)
              return json.load(urllib.request.urlopen(req, timeout=30))
          probes = [
            ("anthropic", "ANTHROPIC_API_KEY", lambda k: get("https://api.anthropic.com/v1/models", {"x-api-key": k, "anthropic-version": "2023-06-01"})["data"], lambda m: m["id"]),
            ("openai",    "OPENAI_API_KEY",    lambda k: get("https://api.openai.com/v1/models", {"Authorization": "Bearer " + k})["data"], lambda m: m["id"]),
            ("google",    "GOOGLE_API_KEY",    lambda k: get("https://generativelanguage.googleapis.com/v1beta/models?key=" + k, {})["models"], lambda m: m["name"].split("/")[-1]),
            ("xai",       "XAI_API_KEY",       lambda k: get("https://api.x.ai/v1/models", {"Authorization": "Bearer " + k})["data"], lambda m: m["id"]),
          ]
          for name, env, fn, idf in probes:
              k = os.environ.get(env)
              if not k: out.append(f"{name}: NO KEY SET ({env})"); continue
              try: out.append(f"{name}: " + ", ".join(sorted(idf(m) for m in fn(k))[:40]))
              except Exception as e: out.append(f"{name}: ERROR {type(e).__name__} {str(e)[:200]}")
          open("eval/runs/available-models.txt", "w").write("\n\n".join(out) + "\n"); print("\n\n".join(out))
          PY
          set +e
          FRC_GRADER_MODEL="$INSPECT_GRADER_MODEL" inspect eval eval/denial_ai_fidelity.py@"$INSPECT_TASK" -T site="$PWD" --model "$INSPECT_EVAL_MODEL" --log-dir eval/logs --log-format json --max-connections 4 > eval/runs/last-run.log 2>&1
          rc=$?
          tail -c 4000 eval/runs/last-run.log > "eval/runs/last-error-$(echo "$INSPECT_EVAL_MODEL" | tr / _).txt"
          echo "exit=$rc" >> "eval/runs/last-error-$(echo "$INSPECT_EVAL_MODEL" | tr / _).txt"
          exit $rc
      - name: Summarise
        run: |
          python - <<'PY'
          import json, glob, os, datetime
          logs = sorted(glob.glob('eval/logs/*'))
          if not logs:
              tail = open('eval/runs/last-run.log').read()[-4000:] if os.path.exists('eval/runs/last-run.log') else 'no run log'
              name = 'eval/runs/last-error-' + os.environ.get('INSPECT_EVAL_MODEL', 'model').replace('/', '_') + '.txt'
              open(name, 'w').write('NO INSPECT LOG WRITTEN\n' + tail); print(open(name).read()); raise SystemExit(1)
          log = json.load(open(logs[-1]))
          model = log.get('eval', {}).get('model')
          rows = []
          def text_of(content):
              if isinstance(content, str): return content
              return " ".join(b.get('text', '') for b in content if isinstance(b, dict) and b.get('type') == 'text')
          GRADE = {'C': 1.0, 'P': 0.5, 'I': 0.0, 'A': None}
          for s in log.get('samples', []):
              sc = s.get('scores', {})
              fid = sc.get('fidelity_scorer', {})
              g = (fid.get('metadata') or {}).get('grade') or fid.get('answer')
              fv = None if g == 'A' else fid.get('value')
              rows.append({'id': s.get('id'), 'value': sc.get('value_scorer', {}).get('value'), 'fidelity': fv,
                           'answer': text_of(s.get('output', {}).get('choices', [{}])[0].get('message', {}).get('content'))[:500],
                           'fidelity_explanation': (fid.get('explanation') or '')[:300],
                           'tool_calls': sum(1 for m in s.get('messages', []) if m.get('role') == 'assistant' and m.get('tool_calls'))})
          out = {'run': datetime.datetime.utcnow().isoformat(timespec='seconds') + 'Z', 'model': model,
                 'grader': os.environ.get('INSPECT_GRADER_MODEL'), 'battery': 'benchmark.json v1.2',
                 'n': len(rows), 'value_mean': sum((r['value'] or 0) for r in rows) / max(len(rows), 1),
                 'fidelity_mean': (sum(r['fidelity'] for r in rows if r['fidelity'] is not None) / max(sum(1 for r in rows if r['fidelity'] is not None), 1)), 'abstained': sum(1 for r in rows if r['fidelity'] is None), 'samples': rows,
                 'note': 'Automated administration via Inspect; not comparable with human-graded Verdict Day rows until the two are reconciled.'}
          os.makedirs('eval/runs', exist_ok=True)
          out['condition'] = os.environ.get('INSPECT_TASK')
          fn = 'eval/runs/' + out['run'].replace(':', '').replace('-', '')[:15] + '-' + (model or 'model').replace('/', '_') + '-' + (os.environ.get('INSPECT_TASK') or 'task') + '.json'
          json.dump(out, open(fn, 'w'), indent=1)
          print(fn); print(json.dumps({k: v for k, v in out.items() if k != 'samples'}, indent=1))
          PY
        env:
          INSPECT_GRADER_MODEL: ${{ github.event.inputs.grader }}
          INSPECT_TASK: ${{ github.event.inputs.condition }}
          INSPECT_EVAL_MODEL: ${{ github.event.inputs.model }}
      - name: Commit run summary
        if: always()
        run: |
          git config user.name "frc-eval-bot"; git config user.email "bot@financeratecalc.com"
          rm -f eval/runs/last-run.log
          git add eval/runs
          git diff --staged --quiet || git commit -m "eval run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break || sleep $((i*7)); done
      - name: Report to an issue (readable without log access)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSPECT_EVAL_MODEL: ${{ github.event.inputs.model }}
        run: |
          {
            echo "## probe"; cat eval/runs/available-models.txt 2>/dev/null | head -40
            echo; echo "## summary"; ls -t eval/runs/*.json 2>/dev/null | head -1 | xargs -r python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(json.dumps({k:v for k,v in d.items() if k!='samples'},indent=1));[print(s['id'],s['value'],s['fidelity'],s.get('tool_calls')) for s in d['samples']]"
            echo; echo "## run tail"; tail -c 2500 eval/runs/last-run.log 2>/dev/null
          } > report.md
          gh issue create --title "eval $(echo "$INSPECT_EVAL_MODEL") ${{ job.status }} $(date -u +%H:%MZ)" --body-file report.md || true
      - uses: actions/upload-artifact@v4
        with: { name: inspect-log, path: eval/logs }
