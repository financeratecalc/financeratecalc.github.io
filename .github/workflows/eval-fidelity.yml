name: Denial-AI fidelity eval (Inspect)
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Inspect model id"
        default: "anthropic/claude-sonnet-4-6"
      condition:
        description: "denial_ai_fidelity (A: no tools) | denial_ai_fidelity_web (B: web search) | denial_ai_fidelity_with_source (C: MCP)"
        default: "denial_ai_fidelity_with_source"
      grader:
        description: "Grader A for the fidelity scorer"
        default: "anthropic/claude-sonnet-4-6"
      repeats:
        description: "How many times to run the same model (frequency, not a single shot)"
        default: "3"
      grader_b:
        description: "Grader B (optional, different provider) — disagreement is recorded"
        default: ""
permissions:
  contents: write
  issues: write
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.EVAL_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install eval dependencies
        run: |
          pip install -q inspect_ai anthropic openai google-genai mcp
          # xai-sdk is the PyPI name; inspect imports it as xai_sdk. Installed
          # separately and verified, because a missing provider fails the whole
          # run with an error that looks like a model problem.
          pip install -q xai-sdk || echo "xai-sdk unavailable — Grok conditions will be skipped"
          python -c "import inspect_ai; print('inspect_ai ok')"
          python -c "import xai_sdk; print('xai_sdk ok')" || echo "xai_sdk NOT importable"
      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          INSPECT_EVAL_MODEL: ${{ github.event.inputs.model }}
          INSPECT_GRADER_MODEL: ${{ github.event.inputs.grader }}
          FRC_GRADER_B_MODEL: ${{ github.event.inputs.grader_b }}
          REPEATS: ${{ github.event.inputs.repeats }}
          INSPECT_TASK: ${{ github.event.inputs.condition }}
        run: |
          mkdir -p eval/runs
          python - <<'PY'
          import os, json, urllib.request
          out = []
          def get(url, headers):
              req = urllib.request.Request(url, headers=headers)
              return json.load(urllib.request.urlopen(req, timeout=30))
          probes = [
            ("anthropic", "ANTHROPIC_API_KEY", lambda k: get("https://api.anthropic.com/v1/models", {"x-api-key": k, "anthropic-version": "2023-06-01"})["data"], lambda m: m["id"]),
            ("openai",    "OPENAI_API_KEY",    lambda k: get("https://api.openai.com/v1/models", {"Authorization": "Bearer " + k})["data"], lambda m: m["id"]),
            ("google",    "GOOGLE_API_KEY",    lambda k: get("https://generativelanguage.googleapis.com/v1beta/models?key=" + k, {})["models"], lambda m: m["name"].split("/")[-1]),
            ("xai",       "XAI_API_KEY",       lambda k: get("https://api.x.ai/v1/models", {"Authorization": "Bearer " + k})["data"], lambda m: m["id"]),
          ]
          for name, env, fn, idf in probes:
              k = os.environ.get(env)
              if not k: out.append(f"{name}: NO KEY SET ({env})"); continue
              try: out.append(f"{name}: " + ", ".join(sorted(idf(m) for m in fn(k))[:40]))
              except Exception as e: out.append(f"{name}: ERROR {type(e).__name__} {str(e)[:200]}")
          open("eval/runs/available-models.txt", "w").write("\n\n".join(out) + "\n"); print("\n\n".join(out))
          PY
          set +e
          FRC_GRADER_MODEL="$INSPECT_GRADER_MODEL" inspect eval eval/denial_ai_fidelity.py@"$INSPECT_TASK" -T site="$PWD" --model "$INSPECT_EVAL_MODEL" --epochs "${REPEATS:-3}" --log-dir eval/logs --log-format json --max-connections 4 > eval/runs/last-run.log 2>&1
          rc=$?
          tail -c 4000 eval/runs/last-run.log > "eval/runs/last-error-$(echo "$INSPECT_EVAL_MODEL" | tr / _).txt"
          echo "exit=$rc" >> "eval/runs/last-error-$(echo "$INSPECT_EVAL_MODEL" | tr / _).txt"
          exit $rc
      - name: Summarise
        run: |
          python - <<'PY'
          import json, glob, os, datetime
          logs = sorted(glob.glob('eval/logs/*'))
          if not logs:
              tail = open('eval/runs/last-run.log').read()[-4000:] if os.path.exists('eval/runs/last-run.log') else 'no run log'
              name = 'eval/runs/last-error-' + os.environ.get('INSPECT_EVAL_MODEL', 'model').replace('/', '_') + '.txt'
              open(name, 'w').write('NO INSPECT LOG WRITTEN\n' + tail); print(open(name).read()); raise SystemExit(1)
          log = json.load(open(logs[-1]))
          model = log.get('eval', {}).get('model')
          rows = []
          def text_of(content):
              if isinstance(content, str): return content
              return " ".join(b.get('text', '') for b in content if isinstance(b, dict) and b.get('type') == 'text')
          GRADE = {'C': 1.0, 'P': 0.5, 'I': 0.0, 'A': None}
          for s in log.get('samples', []):
              sc = s.get('scores', {})
              fid = sc.get('fidelity_scorer', {}); fidb = sc.get('fidelity_scorer_b', {})
              g = (fid.get('metadata') or {}).get('grade') or fid.get('answer')
              gb = (fidb.get('metadata') or {}).get('grade') or fidb.get('answer')
              fv = None if g in ('A', 'N') else fid.get('value')
              cl = sc.get('cliche_scorer', {})
              rows.append({'id': s.get('id'), 'value': sc.get('value_scorer', {}).get('value'), 'fidelity': fv,
                           'stance': (cl.get('metadata') or {}).get('stance'), 'verdict': (cl.get('metadata') or {}).get('verdict'),
                           'confident_wrong': (cl.get('metadata') or {}).get('confident_wrong'), 'believed_untestable': (cl.get('metadata') or {}).get('believed_untestable'),
                           'cliche_score': cl.get('value'),
                           'answer': text_of(s.get('output', {}).get('choices', [{}])[0].get('message', {}).get('content'))[:500],
                           'fidelity_explanation': (fid.get('explanation') or '')[:300],
                           'tool_calls': sum(1 for m in s.get('messages', []) if m.get('role') == 'assistant' and m.get('tool_calls')),
                           'failure_codes': (fid.get('metadata') or {}).get('failure_codes', []),
                           'grade_a': g, 'grade_b': gb, 'graders_agree': (None if not gb else g == gb)})
          import collections
          byq = collections.defaultdict(list)
          for r in rows: byq[r['id']].append(r)
          questions = {}
          for qid, rs in sorted(byq.items()):
              grades = [r['grade_a'] or r.get('stance') for r in rs]
              codes = sorted({c for r in rs for c in r['failure_codes']})
              consistent = len(set(grades)) == 1
              questions[qid] = {'runs': len(rs), 'grades': grades, 'consistent': consistent,
                                'value': f"{sum(1 for r in rs if r['value'])}/{len(rs)}",
                                'codes': codes}
          epochs = max((len(v) for v in byq.values()), default=1)
          total = len(rows)
          out = {'run': datetime.datetime.utcnow().isoformat(timespec='seconds') + 'Z', 'model': model,
                 'grader': os.environ.get('INSPECT_GRADER_MODEL'), 'grader_b': os.environ.get('FRC_GRADER_B_MODEL') or None,
                 'battery': 'benchmark.json v1.3', 'condition': os.environ.get('INSPECT_TASK'),
                 'design': f"{len(byq)} questions x {epochs} repeats", 'answers': total,
                 'value_correct': f"{sum(1 for r in rows if r['value'])}/{total}",
                 'clean_abstain': f"{sum(1 for r in rows if r['grade_a'] == 'A')}/{total}",
                 'leaky_abstain': f"{sum(1 for r in rows if r['grade_a'] == 'N')}/{total}",
                 'consistent_questions': f"{sum(1 for q in questions.values() if q['consistent'])}/{len(byq)}",
                 'code_frequency': {c: f"{sum(1 for r in rows for x in r['failure_codes'] if x == c)}/{total}"
                                    for c in sorted({x for r in rows for x in r['failure_codes']})},
                 'grader_agreement': (lambda a: None if not a else f"{sum(1 for x in a if x)}/{len(a)}")([r['graders_agree'] for r in rows if r['graders_agree'] is not None]),
                 'cliche': (None if not any(r['stance'] for r in rows) else {
                     'agree_with_record': f"{sum(1 for r in rows if r['cliche_score'] == 1.0)}/{total}",
                     'confident_wrong': f"{sum(1 for r in rows if r['confident_wrong'])}/{total}",
                     'asserted_the_untestable': f"{sum(1 for r in rows if r['believed_untestable'])}/{total}",
                     'by_claim': {q: {'verdict': rs[0]['verdict'], 'stances': [r['stance'] for r in rs]} for q, rs in byq.items()}}),
                 'reporting_rule': 'Repeats are the same question asked again, not independent questions: report fractions of runs (two of three), never percentages, and always show the denominator as questions x repeats.',
                 'note': 'Automated administration via Inspect; a separate series from the hand-graded Verdict Day rows and not comparable with them.',
                 'questions': questions, 'samples': rows}
          fn = 'eval/runs/current-run.json'
          json.dump(out, open(fn, 'w'), indent=1)
          print(fn); print(json.dumps({k: v for k, v in out.items() if k != 'samples'}, indent=1))
          PY
        env:
          INSPECT_GRADER_MODEL: ${{ github.event.inputs.grader }}
          INSPECT_TASK: ${{ github.event.inputs.condition }}
          INSPECT_EVAL_MODEL: ${{ github.event.inputs.model }}
      - name: Save results via the GitHub API (no git plumbing)
        if: always()
        env:
          GH_PAT: ${{ secrets.EVAL_PAT }}
          MODEL: ${{ github.event.inputs.model }}
          TASK: ${{ github.event.inputs.condition }}
        run: |
          python - <<'PY'
          import os, json, base64, glob, urllib.request, datetime
          tok = os.environ.get("GH_PAT")
          repo = "financeratecalc/financeratecalc.github.io"
          stamp = datetime.datetime.utcnow().strftime("%Y%m%dT%H%M")
          name = f"{stamp}-{(os.environ.get('MODEL') or 'model').replace('/', '_')}-{os.environ.get('TASK') or 'task'}"
          payload = {}
          if os.path.exists("eval/runs/current-run.json"):
              cand = json.load(open("eval/runs/current-run.json"))
              want = (os.environ.get("MODEL") or "").strip()
              if want and cand.get("model") and cand["model"] != want:
                  payload["ERROR"] = f"summary model {cand['model']} does not match dispatched model {want}; concurrent run collision, result discarded"
              else:
                  payload["summary"] = cand
          for f in ("eval/runs/available-models.txt", "eval/runs/last-run.log"):
              if os.path.exists(f): payload[os.path.basename(f)] = open(f, errors="replace").read()[-6000:]
          body = json.dumps(payload, indent=1).encode()
          def put(path, content, msg):
              url = f"https://api.github.com/repos/{repo}/contents/{path}"
              req = urllib.request.Request(url, method="GET", headers={"Authorization": f"token {tok}"})
              sha = None
              try:
                  sha = json.load(urllib.request.urlopen(req)).get("sha")
              except Exception: pass
              data = {"message": msg, "content": base64.b64encode(content).decode(), "branch": "main"}
              if sha: data["sha"] = sha
              req = urllib.request.Request(url, method="PUT", data=json.dumps(data).encode(),
                                           headers={"Authorization": f"token {tok}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r: return r.status
          if not tok:
              print("NO EVAL_PAT SECRET"); raise SystemExit(1)
          print("wrote", put(f"eval/runs/{name}.json", body, f"eval run {name}"))
          PY
      - uses: actions/upload-artifact@v4
        with: { name: inspect-log, path: eval/logs }
