name: Statement probe (the live check endpoint, asked from outside)
# Asks the live service the questions a verifier asks: a digest in force, a digest never issued, the staged test Subject, and a
# statement that was issued in error. The answer is recorded with where and when it was asked from, because a check is only as good as the vantage
# point it was made from. Manual.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime
          EP = "https://frc-mcp.ziyetis.workers.dev/statement/"
          L = json.load(open("transparency/statement-digests.json"))
          hud = "official-hud-lpt-2026-08-serious-delinquency-rate"
          cases = [("in force", hud, L["digests"][hud][-1]["digest"], "current"),
                   ("never issued", hud, "5ee0c9a1b8f2d4e6a7c3b9d1e5f7a2c4b6d8e0f1a3c5e7b9d2f4a6c8e0b1d3f5", "unrecognized"),
                   ("staged test, revision 1", "test-staged-correction", L["test_vectors"]["test-staged-correction"][0]["digest"], "current" if len(L["test_vectors"]["test-staged-correction"]) == 1 else "superseded")]
          fw = "metro-gap-fort-wayne-in-2025"
          cases += [("in force", fw, L["digests"][fw][-1]["digest"], "current")] + [("issued in error", fw, h["digest"], "issued_in_error") for h in L["digests"][fw] if h.get("issued_in_error")]
          cases += [("demonstration: " + k, k, v[-1]["digest"], "current") for k, v in L["test_vectors"].items() if k.startswith("example-")]
          out, bad = [], 0
          for what, sid, dg, want in cases:
              req = urllib.request.Request(EP + sid + "?digest=" + dg, headers={"User-Agent": "frc-statement-probe", "Cache-Control": "no-cache"})
              r = urllib.request.urlopen(req, timeout=30); j = json.loads(r.read())
              ok = j.get("state") == want and j.get("asked_digest") == dg
              bad += 0 if ok else 1
              out.append({"case": what, "subject": sid, "asked_digest": dg, "expected": want, "state": j.get("state"), "echoed_digest": j.get("asked_digest"), "checked_at": j.get("checked_at"), "cache_status": r.headers.get("cf-cache-status"), "ok": ok})
              print(("OK  " if ok else "FAIL"), what, "->", j.get("state"), "| echoed", str(j.get("asked_digest"))[:12], "| checked_at", j.get("checked_at"), "| cf-cache", r.headers.get("cf-cache-status"))
          # A verifier's script often uses its language's default client. An outside reader reported HTTP 403 for Python's default
          # User-Agent from one vantage point; record what each common default gets from here, on both addresses. Recorded, not failed.
          clients = []
          for host in ("https://frc-mcp.ziyetis.workers.dev/statement/", "https://financeratecalc.com/statement/"):
              for ua in (None, "curl/8.5.0", "python-requests/2.32.3", "Go-http-client/2.0", "frc-statement-probe"):
                  rq = urllib.request.Request(host + hud + "?digest=" + L["digests"][hud][-1]["digest"]) if ua is None else urllib.request.Request(host + hud + "?digest=" + L["digests"][hud][-1]["digest"], headers={"User-Agent": ua})
                  try:
                      rr = urllib.request.urlopen(rq, timeout=30); code, body, ray = rr.status, rr.read()[:80].decode("utf8", "replace"), rr.headers.get("cf-ray")
                  except urllib.error.HTTPError as e:
                      code, body, ray = e.code, e.read()[:120].decode("utf8", "replace"), e.headers.get("cf-ray")
                  except Exception as e:
                      code, body, ray = None, str(e)[:120], None
                  clients.append({"address": host, "user_agent": ua or "Python-urllib (default)", "http": code, "cf_ray_pop": (ray or "").split("-")[-1], "body_start": body})
                  print("client", host.split("/")[2], "|", ua or "Python-urllib default", "->", code, "|", (ray or "").split("-")[-1], "|", body[:60].replace("\n", " "))
          # Does the edge serve the bytes that were published? (T. Meister, SCITT list, 2026-11-27: an edge setting injected a
          # script into a publisher's HTML, so one vantage point reproduced the sealed bytes and another did not.) Compare the
          # SHA-256 of what this runner is served with the SHA-256 of the file in this checkout. Recorded, not failed.
          import hashlib
          served = []
          for rel in ("verify.html", "revision-ledger.html", "for-newsrooms.html", "llms.txt", "transparency/statement-digests.json", "transparency/statement-key.json",
                      "claims/national-fha-denial-rate-2025.json", "spec/ietf/vectors/test-staged-correction.json", ".well-known/agent-skills/index.json", "assets/receipt-badge.js"):
              want = hashlib.sha256(open(rel, "rb").read()).hexdigest(); row = {"path": rel, "published_sha256": want, "published_bytes": len(open(rel, "rb").read())}
              for ua in (None, "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"):
                  rq = urllib.request.Request("https://financeratecalc.com/" + rel, headers=({"User-Agent": ua} if ua else {}) | {"Cache-Control": "no-cache"})
                  try:
                      rr = urllib.request.urlopen(rq, timeout=30); body = rr.read(); got = hashlib.sha256(body).hexdigest()
                      row["python_default" if ua is None else "browser_like"] = {"http": rr.status, "bytes": len(body), "same_bytes": got == want, "cf_ray_pop": (rr.headers.get("cf-ray") or "").split("-")[-1], "cf_cache": rr.headers.get("cf-cache-status")}
                  except Exception as e:
                      row["python_default" if ua is None else "browser_like"] = {"error": str(e)[:100]}
              served.append(row)
              print("bytes", rel, "|", {k: (v.get("same_bytes"), v.get("bytes")) for k, v in row.items() if isinstance(v, dict)}, "| published", row["published_bytes"])
          json.dump({"generated": datetime.datetime.utcnow().isoformat() + "Z", "vantage": "GitHub-hosted runner, python urllib, User-Agent frc-statement-probe", "results": out, "default_clients": clients, "served_bytes": served}, open("eval/statement-probe.json", "w"), indent=1)
          raise SystemExit(1 if bad else 0)
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/statement-probe.json; git diff --cached --quiet || git commit -m "statement probe [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
