name: Rule discovery (agency pages -> candidates, human approves)
# Weekly. Fetches six agency pages, logs what changed, and - only when the DISCOVERY_ENABLED
# repository variable is "1" - sends the changed, keyword-bearing paragraphs to a small model that
# quotes any dated numeric constant it finds. Output: rules/candidates.json (status: pending).
# Nothing is approved by this workflow. Cost with the model on: a few cents per run.
on:
  schedule:
    - cron: "25 7 * * 2"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, diff, extract
        env:
          ANTHROPIC_API_KEY: ${{ vars.DISCOVERY_ENABLED == '1' && secrets.ANTHROPIC_API_KEY || '' }}
        run: python3 scripts/discover_rule_candidates.py
      - name: Commit snapshots and candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/candidates.json eval/rule-sources
          git diff --cached --quiet || git commit -m "rule discovery: weekly fetch [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
