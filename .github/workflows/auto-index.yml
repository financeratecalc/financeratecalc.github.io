name: Weekly IndexNow (canonical pages only)

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC
  workflow_dispatch:

# NOTE (2026-09-05): rewritten after a Bing Webmaster audit.
# The previous version pinged Google's retired /ping endpoint, re-submitted a
# single URL to IndexNow on every run (18K submissions, 0 indexed), and still
# listed zai-one.html, which was retired on 2026-09-04. IndexNow rewards small,
# accurate, genuinely-changed URL sets; sitemap.xml (index of 3 maps, ~1,140
# URLs) remains the canonical discovery surface for both engines.

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Submit canonical pages to IndexNow
        run: |
          KEY="bd45cca31ee741d782a82eb0be514e13"
          BODY=$(cat <<'JSON'
          {
            "host": "financeratecalc.com",
            "key": "KEYPLACEHOLDER",
            "keyLocation": "https://financeratecalc.com/KEYPLACEHOLDER.txt",
            "urlList": [
              "https://financeratecalc.com/",
              "https://financeratecalc.com/door-effect.html",
              "https://financeratecalc.com/metro-gaps.html",
              "https://financeratecalc.com/evidence-navigator.html",
              "https://financeratecalc.com/predictions-2026.html",
              "https://financeratecalc.com/case-files/",
              "https://financeratecalc.com/corrections.html",
              "https://financeratecalc.com/data.html",
              "https://financeratecalc.com/press.html",
              "https://financeratecalc.com/fha-denial-rates-top-100.html"
            ]
          }
          JSON
          )
          BODY="${BODY//KEYPLACEHOLDER/$KEY}"
          CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$BODY")
          echo "IndexNow HTTP $CODE"; cat /tmp/resp.txt || true
          if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then echo "::warning::IndexNow returned $CODE"; fi
