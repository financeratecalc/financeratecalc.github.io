name: frc-mcp conformance (live endpoint)
# Runs the deterministic suite against the deployed worker and publishes eval/frc-mcp-conformance.json.
# Triggered after each worker deploy, weekly, and by hand. No model, no cost beyond the HTTP calls.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy MCP Worker"]
    types: [completed]
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: write
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Protocol suite against the live endpoint
        run: node scripts/frc_mcp_conformance.mjs https://frc-mcp.ziyetis.workers.dev eval/frc-mcp-conformance.json || echo "PROTOCOL SUITE FAILED" >> conformance.failed
      - name: Evidence suite (published fixtures) against the live endpoint
        run: node scripts/frc_mcp_evidence_conformance.mjs https://frc-mcp.ziyetis.workers.dev eval/frc-mcp-evidence-conformance.json || echo "EVIDENCE SUITE FAILED" >> conformance.failed
      - name: Append to the history index (never overwrites)
        run: node scripts/frc_conformance_history.mjs
      - name: Commit the reports
        run: |
          git config user.name "frc-conformance" && git config user.email "press@financeratecalc.com"
          git add eval/frc-mcp-conformance.json eval/frc-mcp-evidence-conformance.json eval/frc-mcp-conformance-history.json
          git diff --cached --quiet || git commit -m "frc-mcp conformance report [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
      - name: Fail the job if the suite failed (after publishing the report)
        run: test ! -f conformance.failed
