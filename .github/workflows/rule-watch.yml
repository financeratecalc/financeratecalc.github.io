name: Rule Watch (dogfood on this site)
on:
  push:
    branches: [main]
    paths: ["**/*.html", "rulecheck/**"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
jobs:
  rule-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./rulecheck
        with:
          fail-on: stale
          exclude: "eval/*,rulecheck/*,rl-env/*,scripts/*,fixtures/*,examples/*,.github/*,corrections.*,case-files/*,readers/*"
      - name: One page, one value (state and lender pages agree with their receipts)
        run: python3 scripts/check_page_values.py
      - name: No retired product offered anywhere (Zai, Verdict, partner programme)
        run: |
          python3 scripts/retire_zai_remnants.py | tee /tmp/zai.txt
          grep -q "pages rewritten: 0" /tmp/zai.txt
          git diff --quiet || { echo "::error::retired product text reappeared; run scripts/retire_zai_remnants.py"; git diff --stat; exit 1; }
      - name: No individual-verdict tool offered anywhere (31 Oct retirements)
        run: |
          python3 scripts/retire_prediction_tools.py | tee /tmp/pred.txt
          grep -q "pages rewritten: 0" /tmp/pred.txt || { echo "::error::prediction-tool links or wording reappeared; run scripts/retire_prediction_tools.py"; exit 1; }
      - name: No phrasing the record cannot support (same application at two lenders, your odds, will deny you)
        run: python3 scripts/check_page_phrasing.py
      - name: Application-outcomes page is current with its data and claims
        run: python3 scripts/build_outcomes_page.py --check || { echo "::error::outcomes page stale; run scripts/build_outcomes_page.py"; exit 1; }
      - name: Home page must match the data it is generated from
        run: python3 scripts/build_home.py --check || echo "::warning::home page stale; the daily snapshot job rebuilds it"
      - name: Program pages and the claims index must match their data
        run: |
          python3 scripts/build_claims_index.py --check || { echo "::error::claims index stale; run scripts/build_claims_index.py"; exit 1; }
          for p in va usda conv; do [ -f data/programs/$p-2025.json ] && { python3 scripts/build_program_page.py $p --check || { echo "::error::$p page stale"; exit 1; }; }; done; true
      - name: Official-figures page must match data/official and the claims
        run: python3 scripts/build_official_page.py --check || { echo "::error::official-figures page stale; run scripts/build_official_page.py"; exit 1; }
      - name: Revision ledger is generated from the restated editions
        run: python3 scripts/build_revisions_feed.py >/dev/null && python3 scripts/build_revision_ledger.py --check || { echo "::error::revision ledger stale; run scripts/build_revision_ledger.py"; exit 1; }
      - name: The gate passes every contract's own canonical sentence
        run: node scripts/check_canonical_pass.mjs
      - name: Receipt rail (NeMo Guardrails integration) - checking logic, no network
        run: cd integrations/nemo-guardrails/receipt-rail && python3 test_actions.py
      - name: Edition-aware question set is generated from the receipted figures and scores its own reference answers
        run: python3 scripts/build_edition_qa.py --check && python3 scripts/build_edition_qa.py --selftest
      - name: locate_denominator (server tool) places known figures on the denominator map
        run: node scripts/check_locate_denominator.mjs
      - name: Sample Evidence Brief is generated from the logged answer and the published cells
        run: python3 scripts/build_sample_brief.py --check
      - name: Place-a-number (browser tool for any table) reproduces known placements
        run: node scripts/check_place_number.mjs
      - name: Denial Genome page is generated from the published lender files
        run: python3 scripts/build_genome_page.py --check
      - name: Denominator diagnosis page is generated from the published cells
        run: python3 scripts/build_diagnosis_page.py --check
      - name: Fannie Mae DU credit-score rule, checked through the server code run locally
        run: node scripts/check_rule_du_score.mjs
      - name: No sponsored, partner or affiliate link, no commission line, no lender-routing link anywhere on the site
        run: python3 scripts/remove_affiliate.py --check
      - name: Figure Radar (subscribe, silent first run, one signed empty push per event, cleanup), through the server code run locally
        run: node scripts/check_radar.mjs
      - name: Witness (drawn here, answered once, signed, chained; free allowance then credits), through the server code run locally
        run: node scripts/check_witness.mjs
      - name: The front door for agents (Link headers, Markdown on request, API catalog, server card, skills index), through the server code run locally
        run: (python3 scripts/build_agent_discovery.py --check || echo "::warning::agent discovery files stale; the daily snapshot job rebuilds them") && node scripts/check_agent_discovery.mjs
      - name: WebMCP tools give the same verdict as the verify service for every receipt issued; find and get carry receipts that verify
        run: node scripts/check_webmcp.mjs
      - name: Figure Statements (every receipted figure as a COSE_Sign1 Signed Statement whose signature, Issuer, Subject and payload check out), through the server code run locally
        run: node scripts/check_statements.mjs && (node scripts/build_statement_digests.mjs --check || echo "::warning::a current statement digest is not yet listed; the claim transparency job adds it")
      - name: Typed examples in the main text fields are real receipts that verify today
        run: python3 scripts/inject_typed_examples.py --check
      - name: Every bound table still matches its data file, row by row
        run: python3 scripts/bind_tables.py --check
      - name: Old template layer stays converted (no unsourced market figures, routing links or verdicts return)
        run: python3 scripts/retire_old_layer.py --check
      - name: Proof of reading (draw, verify, proof line, offline verifier), through the server code run locally
        run: node scripts/check_reading_proof.mjs
      - name: Reading Proof 0.2 for any document (two implementations agree; short and holed copies fail)
        run: node scripts/check_read_proof.mjs
      - name: Reading-proof Kaggle task scores simulated readers as intended (honest reader passes, inventor is counted)
        run: python3 scripts/build_read_proof_task.py --selftest
      - name: Reward audit is current (scripted exploit policies against both rewards)
        run: python3 scripts/reward_audit.py --check
      - name: Denominator-reasoning tasks reproduce from their seed and score their own reference answers
        run: python3 scripts/build_denominator_tasks.py --check && python3 scripts/build_denominator_tasks.py --selftest
      - name: Denominator map must match data/purpose and the claims (when it exists)
        run: if ls data/purpose/*-2025.json >/dev/null 2>&1; then python3 scripts/build_denominator_map.py --check || { echo "::error::denominator map stale; run scripts/build_denominator_map.py"; exit 1; }; fi
      - name: Lender pages' reason sections must match the lender receipts
        run: python3 scripts/build_lender_reason_sections.py --check || { echo "::error::lender reason sections stale; run scripts/build_lender_reason_sections.py"; exit 1; }
      - name: Reason-fingerprints page must match the lender receipts
        run: python3 scripts/build_reason_fingerprints_page.py --check || { echo "::error::fingerprints page stale; run scripts/build_reason_fingerprints_page.py"; exit 1; }
      - name: QSI data and page are current with the archived answers
        run: python3 scripts/qualifier_survival.py --check && python3 scripts/build_qsi_page.py --check
      - name: Index pages are current (every page has an incoming link)
        run: python3 scripts/build_site_index.py --check || { echo "::error::index pages stale; run scripts/build_site_index.py"; exit 1; }
      - name: Claim documents agree with the data files (Receipt 1.0)
        run: python3 scripts/build_claim_documents.py --check
      - name: llms-full.txt carries every claim document
        run: python3 scripts/build_llms_full.py --check
      - name: agentevals suite in step with the fixtures
        run: python3 scripts/build_agentevals.py && git diff --quiet -- evals/agentevals/EVAL.yaml || { echo "::error::evals/agentevals/EVAL.yaml out of date; run scripts/build_agentevals.py"; exit 1; }
      - name: receipt-verify package verifies offline against the repo's own documents
        run: node packages/receipt-verify/test.mjs
      - name: Every page links home
        run: |
          python3 scripts/inject_site_nav.py | tee /tmp/nav.txt
          grep -q "nav added to 0 pages" /tmp/nav.txt || { echo "::error::pages without a link home appeared; run scripts/inject_site_nav.py"; exit 1; }
  nemo-live:
    # The receipt rail inside the real NeMo Guardrails library. Manual runs only (Run workflow); the result is committed
    # to integrations/nemo-guardrails/receipt-rail/live-test.json whether it passes or not.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q nemoguardrails 2>&1 | tail -2
      - name: Two messages through the output rail (issued receipt, altered receipt)
        run: |
          R=$(python3 -c "import json;print(json.load(open('claims/national-fha-denial-rate-2025.json'))['receipt'])")
          cd integrations/nemo-guardrails/receipt-rail && python3 live_test.py "$R"
      - name: Record the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add integrations/nemo-guardrails/receipt-rail/live-test.json
          git diff --cached --quiet || git commit -m "receipt rail: live test in NeMo Guardrails [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
