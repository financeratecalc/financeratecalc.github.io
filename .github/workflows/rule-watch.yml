name: Rule Watch (dogfood on this site)
on:
  push:
    branches: [main]
    paths: ["**/*.html", "rulecheck/**"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
jobs:
  rule-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./rulecheck
        with:
          fail-on: stale
          exclude: "eval/*,rulecheck/*,rl-env/*,scripts/*,fixtures/*,examples/*,.github/*,corrections.*,case-files/*,readers/*"
      - name: One page, one value (state and lender pages agree with their receipts)
        run: python3 scripts/check_page_values.py
      - name: No retired product offered anywhere (Zai, Verdict, partner programme)
        run: |
          python3 scripts/retire_zai_remnants.py | tee /tmp/zai.txt
          grep -q "pages rewritten: 0" /tmp/zai.txt
          git diff --quiet || { echo "::error::retired product text reappeared; run scripts/retire_zai_remnants.py"; git diff --stat; exit 1; }
      - name: No individual-verdict tool offered anywhere (31 Oct retirements)
        run: |
          python3 scripts/retire_prediction_tools.py | tee /tmp/pred.txt
          grep -q "pages rewritten: 0" /tmp/pred.txt || { echo "::error::prediction-tool links or wording reappeared; run scripts/retire_prediction_tools.py"; exit 1; }
      - name: No phrasing the record cannot support (same application at two lenders, your odds, will deny you)
        run: python3 scripts/check_page_phrasing.py
      - name: Application-outcomes page is current with its data and claims
        run: python3 scripts/build_outcomes_page.py --check || { echo "::error::outcomes page stale; run scripts/build_outcomes_page.py"; exit 1; }
      - name: Home page must match the data it is generated from
        run: python3 scripts/build_home.py --check || echo "::warning::home page stale; the daily snapshot job rebuilds it"
      - name: Program pages and the claims index must match their data
        run: |
          python3 scripts/build_claims_index.py --check || { echo "::error::claims index stale; run scripts/build_claims_index.py"; exit 1; }
          for p in va usda conv; do [ -f data/programs/$p-2025.json ] && { python3 scripts/build_program_page.py $p --check || { echo "::error::$p page stale"; exit 1; }; }; done; true
      - name: Official-figures page must match data/official and the claims
        run: python3 scripts/build_official_page.py --check || { echo "::error::official-figures page stale; run scripts/build_official_page.py"; exit 1; }
      - name: Revision ledger is generated from the restated editions
        run: python3 scripts/build_revisions_feed.py >/dev/null && python3 scripts/build_revision_ledger.py --check || { echo "::error::revision ledger stale; run scripts/build_revision_ledger.py"; exit 1; }
      - name: Lender pages' reason sections must match the lender receipts
        run: python3 scripts/build_lender_reason_sections.py --check || { echo "::error::lender reason sections stale; run scripts/build_lender_reason_sections.py"; exit 1; }
      - name: Reason-fingerprints page must match the lender receipts
        run: python3 scripts/build_reason_fingerprints_page.py --check || { echo "::error::fingerprints page stale; run scripts/build_reason_fingerprints_page.py"; exit 1; }
      - name: QSI data and page are current with the archived answers
        run: python3 scripts/qualifier_survival.py --check && python3 scripts/build_qsi_page.py --check
      - name: Index pages are current (every page has an incoming link)
        run: python3 scripts/build_site_index.py --check || { echo "::error::index pages stale; run scripts/build_site_index.py"; exit 1; }
      - name: Claim documents agree with the data files (Receipt 1.0)
        run: python3 scripts/build_claim_documents.py --check
      - name: llms-full.txt carries every claim document
        run: python3 scripts/build_llms_full.py --check
      - name: agentevals suite in step with the fixtures
        run: python3 scripts/build_agentevals.py && git diff --quiet -- evals/agentevals/EVAL.yaml || { echo "::error::evals/agentevals/EVAL.yaml out of date; run scripts/build_agentevals.py"; exit 1; }
      - name: receipt-verify package verifies offline against the repo's own documents
        run: node packages/receipt-verify/test.mjs
      - name: Every page links home
        run: |
          python3 scripts/inject_site_nav.py | tee /tmp/nav.txt
          grep -q "nav added to 0 pages" /tmp/nav.txt || { echo "::error::pages without a link home appeared; run scripts/inject_site_nav.py"; exit 1; }
