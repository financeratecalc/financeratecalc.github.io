name: Rule Watch (dogfood on this site)
on:
  push:
    branches: [main]
    paths: ["**/*.html", "rulecheck/**"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
jobs:
  rule-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./rulecheck
        with:
          fail-on: stale
          exclude: "eval/*,rulecheck/*,rl-env/*,scripts/*,fixtures/*,examples/*,.github/*,corrections.*,case-files/*,readers/*"
      - name: One page, one value (state and lender pages agree with their receipts)
        run: python3 scripts/check_page_values.py
      - name: No retired product offered anywhere (Zai, Verdict, partner programme)
        run: |
          python3 scripts/retire_zai_remnants.py | tee /tmp/zai.txt
          grep -q "pages rewritten: 0" /tmp/zai.txt
          git diff --quiet || { echo "::error::retired product text reappeared; run scripts/retire_zai_remnants.py"; git diff --stat; exit 1; }
      - name: Claim documents agree with the data files (Receipt 1.0)
        run: python3 scripts/build_claim_documents.py --check
      - name: Every page links home
        run: |
          python3 scripts/inject_site_nav.py | tee /tmp/nav.txt
          grep -q "nav added to 0 pages" /tmp/nav.txt || { echo "::error::pages without a link home appeared; run scripts/inject_site_nav.py"; exit 1; }
