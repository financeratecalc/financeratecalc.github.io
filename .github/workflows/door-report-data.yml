name: Door Report cells (lender rates inside borrower cohorts, from the CFPB file)
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "CFPB file URL (FHA extract)"
        default: "https://ffiec.cfpb.gov/v2/data-browser-api/view/nationwide/csv?years=2025&loan_types=2"
permissions:
  contents: read
jobs:
  cells:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download the CFPB file
        run: |
          curl -L --compressed --retry 3 --max-time 3600 -o /tmp/hmda_2025_fha.csv -w "http %{http_code} bytes %{size_download}\n" "${{ github.event.inputs.source_url }}"
          echo "sha256=$(sha256sum /tmp/hmda_2025_fha.csv | cut -c1-64)" | tee -a $GITHUB_OUTPUT
      - name: Build cells
        run: python scripts/door_report_cells.py /tmp/hmda_2025_fha.csv data/door-report-cells-2025.json 2>&1 | tail -5
      - name: Resolve missing lender names from GLEIF (public API) and extend data/lei-names.json
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, time
          p = "data/door-report-cells-2025.json"; d = json.load(open(p, encoding="utf-8"))
          missing = sorted({l["lei"] for c in d["data"].values() for l in c["lenders"] if not l.get("name")})
          print("unnamed LEIs:", len(missing))
          names = {}
          for i in range(0, len(missing), 100):
              batch = missing[i:i+100]
              url = "https://api.gleif.org/api/v1/lei-records?" + urllib.parse.urlencode({"filter[lei]": ",".join(batch), "page[size]": 100})
              try:
                  r = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Accept": "application/vnd.api+json", "User-Agent": "frc-door-report"}), timeout=60))
                  for rec in r.get("data", []):
                      a = rec.get("attributes", {}); names[a.get("lei")] = {"legal_name": (a.get("entity", {}).get("legalName", {}) or {}).get("name"), "entity_status": a.get("entity", {}).get("status"), "jurisdiction": a.get("entity", {}).get("jurisdiction")}
              except Exception as e:
                  print("gleif batch failed:", str(e)[:100])
              time.sleep(1)
          print("resolved:", len(names))
          for c in d["data"].values():
              for l in c["lenders"]:
                  if not l.get("name") and l["lei"] in names and names[l["lei"]]["legal_name"]:
                      l["name"] = names[l["lei"]]["legal_name"]
          json.dump(d, open(p, "w", encoding="utf-8"), separators=(",", ":"), ensure_ascii=False)
          ln = "data/lei-names.json"; L = json.load(open(ln, encoding="utf-8")); L.setdefault("names", {}).update(names); L["count"] = len(L["names"])
          json.dump(L, open(ln, "w", encoding="utf-8"), indent=1, ensure_ascii=False)
          PY
      - name: Record input hash and publish via the GitHub API
        env:
          GH_PAT: ${{ secrets.EVAL_PAT }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request, hashlib
          p = "data/door-report-cells-2025.json"
          d = json.load(open(p, encoding="utf-8"))
          d["input_sha256"] = hashlib.sha256(open("/tmp/hmda_2025_fha.csv", "rb").read()).hexdigest()
          d["code_commit"] = os.environ["GITHUB_SHA"]
          json.dump(d, open(p, "w", encoding="utf-8"), separators=(",", ":"), ensure_ascii=False)
          tok = os.environ["GH_PAT"]; repo = "financeratecalc/financeratecalc.github.io"
          url = f"https://api.github.com/repos/{repo}/contents/{p}"
          sha = None
          try: sha = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": f"token {tok}"}))).get("sha")
          except Exception: pass
          body = {"message": "door report cells rebuilt from the CFPB file [skip ci]", "content": base64.b64encode(open(p, "rb").read()).decode(), "branch": "main"}
          if sha: body["sha"] = sha
          req = urllib.request.Request(url, method="PUT", data=json.dumps(body).encode(), headers={"Authorization": f"token {tok}", "Content-Type": "application/json"})
          print(urllib.request.urlopen(req).status, os.path.getsize(p))
          p2 = "data/lei-names.json"; url2 = f"https://api.github.com/repos/{repo}/contents/{p2}"
          sha2 = None
          try: sha2 = json.load(urllib.request.urlopen(urllib.request.Request(url2, headers={"Authorization": f"token {tok}"}))).get("sha")
          except Exception: pass
          body2 = {"message": "lei-names extended from GLEIF [skip ci]", "content": base64.b64encode(open(p2, "rb").read()).decode(), "branch": "main"}
          if sha2: body2["sha"] = sha2
          req2 = urllib.request.Request(url2, method="PUT", data=json.dumps(body2).encode(), headers={"Authorization": f"token {tok}", "Content-Type": "application/json"})
          print(urllib.request.urlopen(req2).status)
          PY
