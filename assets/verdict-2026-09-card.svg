<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@900&amp;family=DM+Sans:wght@400;600;700&amp;family=DM+Mono&amp;display=swap');</style></defs>
<rect width="1080" height="1350" fill="#08090c"/>
