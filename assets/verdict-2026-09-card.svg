<text x="64" y="92" font-family="DM Mono, monospace" font-size="17" letter-spacing="4" fill="#C8A84B">VERDICT DAY · SEPTEMBER 15, 2026</text>
<text x="64" y="168" font-family="Fraunces, Georgia, serif" font-size="62" font-weight="900" fill="#f5f2ea">The machines</text>
<text x="64" y="238" font-family="Fraunces, Georgia, serif" font-size="62" font-weight="900" fill="#f5f2ea">graded us back.</text>

<rect x="64" y="286" width="952" height="196" rx="14" fill="#150c0c" stroke="#c96f6f" stroke-width="2"/>
<text x="92" y="332" font-family="DM Sans, sans-serif" font-size="24" font-weight="700" fill="#fff">Eight AI systems answered twelve questions we publish the</text>
<text x="92" y="366" font-family="DM Sans, sans-serif" font-size="24" font-weight="700" fill="#fff">answers to. They found three errors — in our numbers.</text>
<text x="92" y="412" font-family="DM Sans, sans-serif" font-size="19" fill="#cbc7bb">Nine stale lender rates on sixteen pages. A wrong state figure repeated by</text>
<text x="92" y="440" font-family="DM Sans, sans-serif" font-size="19" fill="#cbc7bb">three systems. And a withdrawn number still sitting in the machine-readable</text>
<text x="92" y="468" font-family="DM Sans, sans-serif" font-size="19" fill="#cbc7bb">files we publish so that AI can quote us accurately. All three fixed and logged.</text>

<text x="64" y="552" font-family="DM Mono, monospace" font-size="15" letter-spacing="3" fill="#C8A84B">CLEAN SESSION — one fresh chat per question</text>
<line x1="64" y1="566" x2="1016" y2="566" stroke="#23262e" stroke-width="1"/>
<text x="64" y="614" font-family="DM Sans, sans-serif" font-size="21" fill="#e8e4da">Perplexity</text>
<rect x="314" y="591" width="44" height="32" rx="6" fill="#8fb46a" opacity="0.18"/>
<text x="336" y="614" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="900" fill="#8fb46a" text-anchor="middle">B</text>
<text x="376" y="614" font-family="DM Mono, monospace" font-size="17" fill="#8f8b80">85.3</text><text x="64" y="660" font-family="DM Sans, sans-serif" font-size="21" fill="#e8e4da">ChatGPT</text>
<rect x="314" y="637" width="44" height="32" rx="6" fill="#C8A84B" opacity="0.18"/>
<text x="336" y="660" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="900" fill="#C8A84B" text-anchor="middle">C</text>
<text x="376" y="660" font-family="DM Mono, monospace" font-size="17" fill="#8f8b80">71.8</text><text x="64" y="706" font-family="DM Sans, sans-serif" font-size="21" fill="#e8e4da">Gemini</text>
<rect x="314" y="683" width="44" height="32" rx="6" fill="#c96f6f" opacity="0.18"/>
<text x="336" y="706" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="900" fill="#c96f6f" text-anchor="middle">F</text>
<text x="376" y="706" font-family="DM Mono, monospace" font-size="17" fill="#8f8b80">50.6</text>

<text x="64" y="800" font-family="DM Mono, monospace" font-size="15" letter-spacing="3" fill="#C8A84B">BATCHED CONTEXT — all twelve in one message</text>
<text x="64" y="824" font-family="DM Sans, sans-serif" font-size="15" fill="#8f8b80">Reported separately. Not comparable with the clean-session series.</text>
<line x1="64" y1="840" x2="1016" y2="840" stroke="#23262e" stroke-width="1"/>
<text x="64" y="888" font-family="DM Sans, sans-serif" font-size="21" fill="#e8e4da">Grok</text>
