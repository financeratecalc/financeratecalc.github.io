<text x="336" y="888" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="900" fill="#5fb4a2" text-anchor="middle">A</text>
<text x="376" y="888" font-family="DM Mono, monospace" font-size="17" fill="#8f8b80">96.3</text><text x="64" y="934" font-family="DM Sans, sans-serif" font-size="21" fill="#e8e4da">Meta AI</text>
<rect x="314" y="911" width="44" height="32" rx="6" fill="#8fb46a" opacity="0.18"/>
<text x="336" y="934" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="900" fill="#8fb46a" text-anchor="middle">B</text>
<text x="376" y="934" font-family="DM Mono, monospace" font-size="17" fill="#8f8b80">81.7</text><text x="64" y="980" font-family="DM Sans, sans-serif" font-size="21" fill="#e8e4da">DeepSeek</text>
<rect x="314" y="957" width="44" height="32" rx="6" fill="#c9924b" opacity="0.18"/>
<text x="336" y="980" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="900" fill="#c9924b" text-anchor="middle">D</text>
<text x="376" y="980" font-family="DM Mono, monospace" font-size="17" fill="#8f8b80">67.5</text><text x="64" y="1026" font-family="DM Sans, sans-serif" font-size="21" fill="#e8e4da">Claude</text>
<rect x="314" y="1003" width="44" height="32" rx="6" fill="#c96f6f" opacity="0.18"/>
<text x="336" y="1026" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="900" fill="#c96f6f" text-anchor="middle">F</text>
<text x="376" y="1026" font-family="DM Mono, monospace" font-size="17" fill="#8f8b80">54.9</text><text x="64" y="1072" font-family="DM Sans, sans-serif" font-size="21" fill="#e8e4da">Copilot</text>
<rect x="314" y="1049" width="44" height="32" rx="6" fill="#c96f6f" opacity="0.18"/>
<text x="336" y="1072" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="900" fill="#c96f6f" text-anchor="middle">F</text>
<text x="376" y="1072" font-family="DM Mono, monospace" font-size="17" fill="#8f8b80">53.0</text>

<rect x="64" y="1108" width="952" height="106" rx="12" fill="#0d0f14" stroke="#23262e"/>
<text x="92" y="1148" font-family="DM Sans, sans-serif" font-size="19" fill="#cbc7bb">Our own scale has a defect and we are publishing it: an honest</text>
<text x="92" y="1176" font-family="DM Sans, sans-serif" font-size="19" fill="#cbc7bb">&#8220;I don&#8217;t know&#8221; currently scores like a confident wrong answer.</text>
<text x="92" y="1200" font-family="DM Sans, sans-serif" font-size="16" fill="#8f8b80">Being fixed for October.</text>

<text x="64" y="1268" font-family="DM Sans, sans-serif" font-size="20" fill="#C8A84B">financeratecalc.com/verdict-2026-09.html</text>
<text x="64" y="1300" font-family="DM Sans, sans-serif" font-size="16" fill="#8f8b80">Source-fidelity benchmark on a frozen public mortgage-claim battery.</text>
<text x="64" y="1324" font-family="DM Sans, sans-serif" font-size="16" fill="#8f8b80">Not a general intelligence ranking. No individual approval predictions.</text>
