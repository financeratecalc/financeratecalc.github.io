[project]
name = "frc-denial-ai-fidelity"
version = "1.3.0"
description = "Denial-AI fidelity: does a model restate a published FHA-denial statistic within its use contract? Inspect AI tasks (no tools / web / publisher MCP source / receipt-aware client) over a frozen 12-question battery with a model-free value scorer and a contract-graded fidelity scorer."
requires-python = ">=3.11"
license = "CC-BY-4.0"
authors = [{ name = "Ziya Yetiş", email = "press@financeratecalc.com" }]
dependencies = ["inspect_ai>=0.3", "mcp"]

[project.urls]
Homepage = "https://financeratecalc.com/verdict-automated.html"
Repository = "https://github.com/financeratecalc/financeratecalc.github.io"
Specification = "https://financeratecalc.com/spec/claim-contract-1.0-draft.md"
Dataset = "https://huggingface.co/datasets/FinanceRateCalc/denial-ai-benchmark"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eval"]
