name = "frc-mcp"
main = "worker/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Figure Radar is also answered on the site's own domain, so the page talks to its own origin: no cross-site request,
# and it keeps working on networks where *.workers.dev is not reachable. Only /radar/* and /witness/* are routed here.
routes = [
  { pattern = "financeratecalc.com/radar/*", zone_name = "financeratecalc.com" },
  { pattern = "www.financeratecalc.com/radar/*", zone_name = "financeratecalc.com" },
  { pattern = "financeratecalc.com/witness/*", zone_name = "financeratecalc.com" },
  { pattern = "www.financeratecalc.com/witness/*", zone_name = "financeratecalc.com" }
]

# One small store, three uses, each under its own key prefix:
#   (license hashes)  prepaid screening credits: sha256(license key) -> counters. No LEI list, no result, no customer data.
#   mq:               the public misquote ledger.
#   wit:              Witness: document manifests (hashes only), open challenges, signed attestations, the signing key, the chain head.
#   radar:            Figure Radar: a browser push address and the reports chosen, per device; the signing key; the event log.
[[kv_namespaces]]
binding = "CREDITS"
id = "4f804c8639104c2cab42433d2ae061db"

# Figure Radar: once an hour, compare the restated editions and the revision ledger with what was last announced.
[triggers]
crons = ["23 * * * *"]
