[project]
name = "frc-mcp"
version = "1.0.0"
description = "Model Context Protocol server for FHA mortgage denial statistics from the complete US federal record (CFPB HMDA 2025)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Ziya Yetis", email = "press@financeratecalc.com" }]
keywords = ["mcp", "mortgage", "fha", "hmda", "denial-rates", "open-data", "housing-finance"]
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://financeratecalc.com"
Methodology = "https://financeratecalc.com/methodology.html"
Dataset = "https://doi.org/10.5281/zenodo.21575105"
Verification = "https://financeratecalc.com/reconciliation.html"

[project.scripts]
frc-mcp = "frc_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["frc_mcp.py", "frc_data.json"]
