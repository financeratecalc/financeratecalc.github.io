[project]
name = "hmda-record-audit"
version = "0.1.0"
description = "Audit one public HMDA 2025 FHA record: regulatory arithmetic (LTV, FHA MIP under ML 2023-05) and record-consistency rules quoted from the HMDA Filing Instructions Guide. Ground truth from the CFPB file; deterministic rewards; no judge model."
tags = ["finance", "regulatory", "public-records", "deterministic-reward", "single-turn", "hmda", "audit"]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.1.3"]
license = "CC-BY-4.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["hmda_record_audit.py", "tasks.json"]
