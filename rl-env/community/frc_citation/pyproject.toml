[project]
name = "frc-citation"
version = "0.1.0"
description = "Source-faithful citation of published mortgage statistics: call a live publisher, restate the figure inside its use contract, carry a verifiable claim receipt. Deterministic rewards."
tags = ["tool-use", "citation", "fidelity", "finance", "mcp", "deterministic-reward", "single-turn"]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.1.3"]
license = "CC-BY-4.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["frc_citation.py", "questions.json", "receipts-snapshot.json"]
