[project]
name = "frc-citation"
version = "0.1.0"
description = "Source-faithful citation of published statistics with deterministic rewards (FinanceRateCalc, 2025 HMDA)."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1"]
license = "CC-BY-4.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frc_citation", "frc_citation_temporal"]
