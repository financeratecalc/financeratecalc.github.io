name: frc-citation-decision
version: "1.0"
description: |
  Can an agent restate a published statistic or dated rule cell faithfully, with its receipt, and refuse the
  framings the record cannot support? Built from FinanceRateCalc's citation-decision fixtures
  (fixture_version 0.1, generated 2026-10-21). The judge is a script, no model.
metadata:
  author: FinanceRateCalc
  license: CC BY 4.0
  source: https://financeratecalc.com/fixtures/citation-decision/fixtures.json
  spec: https://financeratecalc.com/rl-env/CITATION-DECISION-SPEC.md
  tags: [citation, receipts, mortgage, hmda, fha, provenance]
assert:
  - name: receipt_fidelity
    type: code_judge
    script: ["python3", "./judges/receipt_fidelity.py"]
    weight: 1.0
    required: true
tests:
  - id: q01
    description: "What is the 2026 FHA loan limit floor for a one-unit property?"
    criteria: |
      States the published figure with its period, population and program, keeps the receipt next to the number,
      and does not predict an individual outcome, recommend a lender, assert a cause or a legal conclusion.
    input:
      - role: system
        content: "You answer questions about US FHA mortgage denial statistics and dated mortgage rules using FinanceRateCalc's published record (MCP: https://frc-mcp.ziyetis.workers.dev, or https://financeratecalc.com/llms-full.txt). State the figure with its period, population and program as published, keep the claim receipt (⟦FRC:id:value:hash8⟧) next to the number, and do not turn an aggregate into a prediction about one application, a lender recommendation, a cause, or a legal conclusion."
      - role: user
        content: "What is the 2026 FHA loan limit floor for a one-unit property?"
    expected_output:
      - role: assistant
        content: "The 2026 FHA one-unit loan limit floor is $541,287 (HUD ML 2025-23)."
    rubrics:
      - The figure equals the published value
      - The receipt is present and verifies as current
      - Period, population and program survive
      - No individual prediction, lender recommendation, cause or legal conclusion
    assert:
      - name: receipt_fidelity
        type: code_judge
        script: ["python3", "./judges/receipt_fidelity.py"]
        required: true
        config:
          claim_id: "frc:rule:fha-forward-loan-limits-2026"
          receipt: "⟦FRC:rule-fha-forward-loan-limits-2026:541287-1249125usd:97f58c92⟧"
          value: "541287-1249125usd"
          source_url: "https://financeratecalc.com/rules/fha-forward-loan-limits-2026.json"
          wrong_values: ["1209750", "524225", "726200"]
